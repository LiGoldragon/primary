<!-- Book code highlighting. Paste this whole file, unchanged, at the end of a book page's body.
     Blocks: <pre><code class="language-ethos|language-datom|language-rust|language-clojure|language-bash">.
     Code never wraps midline; the author fits each line (38 characters at 360 px, 42 at 390 px). -->
<style>
:root{--hl-bg:#eceee9;--hl-type:#1c5f8a;--hl-punct:#9a5b13;--hl-comment:#6b7a72;--hl-string:#2f6f3e;--hl-meta:#8a3d6b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hl-bg:#1c2420;--hl-type:#7cc0ee;--hl-punct:#e0a45a;--hl-comment:#7f8e85;--hl-string:#9fd29a;--hl-meta:#d58fb9}}
:root[data-theme="dark"]{--hl-bg:#1c2420;--hl-type:#7cc0ee;--hl-punct:#e0a45a;--hl-comment:#7f8e85;--hl-string:#9fd29a;--hl-meta:#d58fb9}
pre:has(>code[class*="language-"]){background:var(--hl-bg);padding:12px 14px;border-radius:6px;overflow-x:auto;max-width:100%;min-width:0}
pre>code[class*="language-"]{background:none;padding:0;white-space:pre;font-size:.82rem;line-height:1.5;display:block;tab-size:4}
:where(*):has(pre>code[class*="language-"]){min-width:0}
.hl-type,.hljs-keyword,.hljs-title{color:var(--hl-type)}
.hl-punct{color:var(--hl-punct);font-weight:600}.hl-dot,.hljs-built_in,.hljs-type{color:var(--hl-punct)}
.hl-comment,.hljs-comment{color:var(--hl-comment);font-style:italic}
.hl-string,.hljs-string,.hljs-number,.hljs-symbol{color:var(--hl-string)}
.hljs-meta,.hljs-attr,.hljs-variable,.hljs-params{color:var(--hl-meta)}
</style>
<script>
(function(){
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  function line(l){
    var i=l.indexOf(';'),a=i<0?l:l.slice(0,i),c=i<0?'':l.slice(i);
    a=esc(a).replace(/(«[^»]*»)|([A-Z][A-Za-z0-9]*)|([\[\]{}()!])|(\.)/g,function(m,s,t,p,d){
      return s?'<span class="hl-string">'+s+'</span>':t?'<span class="hl-type">'+t+'</span>':p?'<span class="hl-punct">'+p+'</span>':'<span class="hl-dot">.</span>'});
    return a+(c?'<span class="hl-comment">'+esc(c)+'</span>':'');
  }
  document.querySelectorAll('code.language-ethos,code.language-datom').forEach(function(e){
    e.innerHTML=e.textContent.split('\n').map(line).join('\n');
  });
  function hl(){document.querySelectorAll('code.language-rust,code.language-clojure,code.language-bash').forEach(function(e){try{hljs.highlightElement(e)}catch(x){}})}
  var s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js';
  s.onload=function(){var c=document.createElement('script');c.src='https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/clojure.min.js';c.onload=hl;c.onerror=hl;document.head.appendChild(c)};
  document.head.appendChild(s);
})();
</script>
