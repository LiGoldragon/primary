<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 384" width="340" height="384" role="img"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker></defs><rect x="20" y="10" width="300" height="34" rx="6" fill="var(--box,#fff)" stroke="currentColor" stroke-width="1.5"/><text x="170.0" y="32" text-anchor="middle" font-family="sans-serif" font-size="14" fill="currentColor">a flow</text><line x1="170.0" y1="44" x2="170.0" y2="76" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/><text x="180.0" y="60" font-family="sans-serif" font-size="13" fill="currentColor">calls Send</text><rect x="20" y="84" width="300" height="34" rx="6" fill="var(--box,#fff)" stroke="currentColor" stroke-width="1.5"/><text x="170.0" y="106" text-anchor="middle" font-family="sans-serif" font-size="14" fill="currentColor">Flow</text><line x1="170.0" y1="118" x2="170.0" y2="166" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/><text x="180.0" y="134" font-family="sans-serif" font-size="13" fill="currentColor">resolves the sender from</text><text x="180.0" y="150" font-family="sans-serif" font-size="13" fill="currentColor">the calling process, types</text><rect x="20" y="174" width="300" height="34" rx="6" fill="var(--box,#fff)" stroke="currentColor" stroke-width="1.5"/><text x="170.0" y="196" text-anchor="middle" font-family="sans-serif" font-size="14" fill="currentColor">Letter.{ Kind Sender Body }</text><line x1="170.0" y1="208" x2="170.0" y2="240" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/><text x="180.0" y="224" font-family="sans-serif" font-size="13" fill="currentColor">is typed, as datom, into</text><rect x="20" y="248" width="300" height="34" rx="6" fill="var(--box,#fff)" stroke="currentColor" stroke-width="1.5"/><text x="170.0" y="270" text-anchor="middle" font-family="sans-serif" font-size="14" fill="currentColor">the recipient's transcript</text><line x1="170.0" y1="282" x2="170.0" y2="314" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/><text x="180.0" y="298" font-family="sans-serif" font-size="13" fill="currentColor">holds beside it</text><rect x="20" y="322" width="300" height="52" rx="6" fill="var(--box,#fff)" stroke="currentColor" stroke-width="1.5"/><text x="170.0" y="344" text-anchor="middle" font-family="sans-serif" font-size="14" fill="currentColor">the living's words: the only</text><text x="170.0" y="362" text-anchor="middle" font-family="sans-serif" font-size="14" fill="currentColor">text that is not datom</text></svg>