<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 490" width="400" height="490" font-family="sans-serif" font-size="13" fill="none" stroke="#808080" stroke-width="1.5">
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#808080" stroke="none"/>
    </marker>
  </defs>
  <g>
    <rect x="70" y="20" width="150" height="44" rx="4"/>
    <rect x="70" y="130" width="150" height="44" rx="4"/>
    <rect x="70" y="250" width="150" height="44" rx="4"/>
    <rect x="240" y="330" width="150" height="44" rx="4"/>
    <rect x="240" y="420" width="150" height="44" rx="4"/>
  </g>
  <g fill="#808080" stroke="none" text-anchor="middle">
    <text x="145" y="47">a caller</text>
    <text x="145" y="157">an input: Launch</text>
    <text x="145" y="270" font-size="12">its answer: Launched</text>
    <text x="145" y="285" font-size="12">or Refused</text>
