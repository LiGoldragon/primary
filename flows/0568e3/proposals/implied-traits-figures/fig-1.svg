    <line x1="315" y1="374" x2="315" y2="420" marker-end="url(#h)"/>
  </g>
  <g fill="#808080" stroke="none">
    <text x="155" y="100">sends</text>
    <text x="155" y="215">is answered at once by</text>
    <text x="30" y="160" text-anchor="middle" transform="rotate(-90 30 160)">goes back to</text>
    <text x="307" y="178" text-anchor="end">may set off,</text>
