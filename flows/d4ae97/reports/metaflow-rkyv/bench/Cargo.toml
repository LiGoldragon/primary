[package]
name = "metaflow-rkyv-bench"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Exactly the features Flow, sema and sema-engine use today.
rkyv = { version = "=0.8.18", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
redb = "=4.3.0"

[profile.release]
debug = false
