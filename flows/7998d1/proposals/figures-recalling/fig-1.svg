<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 0 430 460" width="430" height="460" font-family="sans-serif" font-size="20" fill="black">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black"/>
    </marker>
  </defs>
  <!-- boxes -->
  <rect x="110" y="20" width="180" height="52" fill="white" stroke="black" stroke-width="2"/>
  <text x="200" y="53" text-anchor="middle">living content</text>
  <rect x="20" y="190" width="160" height="52" fill="white" stroke="black" stroke-width="2"/>
  <text x="100" y="223" text-anchor="middle">important part</text>
  <rect x="220" y="190" width="160" height="52" fill="white" stroke="black" stroke-width="2"/>
  <text x="300" y="223" text-anchor="middle">the transcript</text>
  <rect x="20" y="360" width="160" height="52" fill="white" stroke="black" stroke-width="2"/>
  <text x="100" y="393" text-anchor="middle">fresh flow</text>
  <!-- arrows -->
  <line x1="150" y1="72" x2="100" y2="190" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="115" y="120" text-anchor="end">weighed by</text>
  <text x="115" y="142" text-anchor="end">importance</text>
  <line x1="250" y1="72" x2="300" y2="190" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="285" y="120">the rest</text>
  <text x="285" y="142">stays in</text>
  <line x1="100" y1="242" x2="100" y2="360" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="115" y="306">passes to</text>
</svg>
