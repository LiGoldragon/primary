<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
  </defs>
  <g stroke="black" stroke-width="2" fill="none">
    <line x1="200" y1="76" x2="200" y2="170" marker-end="url(#arrow)"/>
    <line x1="200" y1="226" x2="200" y2="300" marker-end="url(#arrow)"/>
    <line x1="200" y1="400" x2="200" y2="480" marker-end="url(#arrow)"/>
  </g>
  <g stroke="black" stroke-width="2" fill="white">
    <rect x="50" y="20" width="300" height="56" rx="6"/>
    <rect x="50" y="170" width="300" height="56" rx="6"/>
    <rect x="50" y="300" width="300" height="100" rx="6"/>
    <rect x="50" y="480" width="300" height="56" rx="6"/>
  </g>
  <g fill="black" font-size="18" text-anchor="middle">
    <text x="200" y="54">Flow Nexus</text>
    <text x="200" y="204">the flow</text>
    <text x="200" y="332">handover: its judgment</text>
    <text x="200" y="358">on what it is still</text>
    <text x="200" y="384">trying to do</text>
    <text x="200" y="514">the successor, fresh</text>
  </g>
  <g fill="black" font-size="16" text-anchor="start">
    <text x="214" y="112">warns, before</text>
    <text x="214" y="134">the threshold</text>
    <text x="214" y="262">writes</text>
    <text x="214" y="442">first prompt of</text>
  </g>
