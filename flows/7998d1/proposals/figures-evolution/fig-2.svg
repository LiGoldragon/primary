<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 650" width="440" height="650" font-family="sans-serif" font-size="16">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black"/>
    </marker>
  </defs>
  <g stroke="black" stroke-width="2" fill="none">
    <!-- translator to Energy Nexus: Reading, signal -->
    <line x1="100" y1="160" x2="100" y2="290" marker-end="url(#arrow)"/>
    <!-- Energy Nexus to translator: Remind, signal -->
    <line x1="170" y1="290" x2="170" y2="160" marker-end="url(#arrow)"/>
    <!-- Energy Nexus to Flow Nexus: Changed, pushed -->
    <line x1="100" y1="390" x2="100" y2="520" marker-end="url(#arrow)"/>
    <!-- translator to a flow's prompt: Send, to a permaflow -->
    <path d="M 135 60 L 135 25 L 365 25 L 365 60" marker-end="url(#arrow)"/>
  </g>
  <g stroke="black" stroke-width="2" fill="white">
    <rect x="20" y="60" width="230" height="100"/>
    <rect x="310" y="60" width="110" height="100"/>
    <rect x="20" y="290" width="230" height="100"/>
    <rect x="20" y="520" width="230" height="100"/>
  </g>
  <g fill="black" text-anchor="middle">
    <text x="135" y="95">translator:</text>
    <text x="135" y="117">codex app-server,</text>
    <text x="135" y="139">Claude usage, words</text>
    <text x="365" y="105">a flow's</text>
    <text x="365" y="127">prompt</text>
    <text x="135" y="328">Energy Nexus:</text>
    <text x="135" y="350">levels, typed</text>
    <text x="135" y="558">Flow Nexus, later:</text>
    <text x="135" y="580">more flows or fewer</text>
  </g>
  <g fill="black">
    <text x="90" y="215" text-anchor="end">Reading,</text>
    <text x="90" y="237" text-anchor="end">signal</text>
    <text x="182" y="215">Remind, signal</text>
    <text x="112" y="432">Changed.{ Provider Level },</text>
    <text x="112" y="454">pushed</text>
    <text x="250" y="16" text-anchor="middle">Send, to a permaflow</text>
  </g>
</svg>
