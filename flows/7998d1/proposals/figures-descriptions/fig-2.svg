<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="400" height="450" font-family="sans-serif" font-size="13">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="100" y="20" width="200" height="50" rx="6" fill="#e6e6e6" stroke="#555" stroke-width="1.5"/>
  <text x="200" y="50" text-anchor="middle" fill="#222">his vision</text>

  <line x1="200" y1="70" x2="200" y2="148" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="212" y="114" fill="#222">is inferred into</text>

  <rect x="20" y="150" width="360" height="60" rx="6" fill="#e6e6e6" stroke="#555" stroke-width="1.5"/>
  <text x="200" y="185" text-anchor="middle" fill="#222">the proposal: prose + invariant code</text>

  <line x1="150" y1="210" x2="150" y2="368" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="140" y="275" text-anchor="end" fill="#222">he reviews where</text>
  <text x="140" y="292" text-anchor="end" fill="#222">he would do</text>
  <text x="140" y="309" text-anchor="end" fill="#222">otherwise</text>

  <line x1="250" y1="210" x2="250" y2="368" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="260" y="283" fill="#222">Mind implements</text>
