<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 720" width="500" height="720" font-family="sans-serif" font-size="16" fill="black">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
  </defs>

  <!-- Mind enclosure -->
  <rect x="60" y="300" width="280" height="224" fill="none" stroke="black" stroke-width="2"/>
  <text x="72" y="318" text-anchor="start">Mind</text>

  <!-- boxes -->
  <rect x="150" y="20" width="140" height="44" fill="white" stroke="black" stroke-width="2"/>
  <text x="220" y="47" text-anchor="middle">the living</text>

  <rect x="340" y="20" width="140" height="60" fill="white" stroke="black" stroke-width="2"/>
  <text x="410" y="45" text-anchor="middle">a periodic book</text>
  <text x="410" y="65" text-anchor="middle">or audit</text>

  <rect x="110" y="150" width="220" height="66" fill="white" stroke="black" stroke-width="2"/>
  <text x="220" y="178" text-anchor="middle">Psyche:</text>
  <text x="220" y="200" text-anchor="middle">spirit, intent, vision</text>

  <rect x="100" y="326" width="200" height="52" fill="white" stroke="black" stroke-width="2"/>
  <text x="200" y="348" text-anchor="middle">knowledge: facts</text>
  <text x="200" y="368" text-anchor="middle">verified in code</text>

  <rect x="100" y="450" width="200" height="52" fill="white" stroke="black" stroke-width="2"/>
  <text x="200" y="472" text-anchor="middle">the type that holds</text>
  <text x="200" y="492" text-anchor="middle">what is unclear</text>

  <rect x="120" y="590" width="180" height="40" fill="white" stroke="black" stroke-width="2"/>
  <text x="210" y="616" text-anchor="middle">Field</text>

  <!-- arrows, each carrying its verb -->
  <line x1="220" y1="64" x2="220" y2="150" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="232" y="100">reviews psyche</text>
  <text x="232" y="120">proposals, line</text>
  <text x="232" y="140">by line</text>

  <polyline points="150,42 30,42 30,412 60,412" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="42" y="95">skims knowledge</text>
  <text x="42" y="115">proposals</text>

  <line x1="220" y1="216" x2="220" y2="300" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="232" y="240">rules over Mind:</text>
  <text x="232" y="258">a Mind line it</text>
  <text x="232" y="276">contradicts is removed</text>

  <line x1="120" y1="378" x2="120" y2="450" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="132" y="402">an audit for truth and</text>
  <text x="132" y="420">currency finds a</text>
  <text x="132" y="438">variation; it goes to</text>

  <line x1="200" y1="524" x2="200" y2="590" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="212" y="545">rules over Field:</text>
  <text x="212" y="563">a Field line it</text>
  <text x="212" y="581">contradicts is removed</text>

  <polyline points="455,80 455,610 300,610" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="312" y="636">reads it as a whole</text>
  <text x="312" y="654">and checks it</text>
  <text x="312" y="672">against Mind and</text>
  <text x="312" y="690">Psyche</text>
</svg>
