<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 650" width="420" height="650" font-family="sans-serif" font-size="14" fill="#000" stroke="#000">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000" stroke="none"/>
    </marker>
  </defs>

  <!-- the living -->
  <rect x="110" y="16" width="200" height="44" fill="#fff" stroke-width="1.5"/>
  <text x="210" y="44" text-anchor="middle" stroke="none">the living</text>

  <!-- Psyche -->
  <rect x="100" y="120" width="220" height="60" fill="#fff" stroke-width="1.5"/>
  <text x="210" y="145" text-anchor="middle" stroke="none">Psyche: spirit, intent,</text>
  <text x="210" y="163" text-anchor="middle" stroke="none">vision</text>

  <!-- Mind collection -->
  <rect x="20" y="250" width="380" height="206" fill="none" stroke-width="1.5"/>
  <text x="32" y="272" stroke="none">Mind</text>

  <!-- knowledge -->
  <rect x="60" y="280" width="300" height="46" fill="#fff" stroke-width="1.5"/>
  <text x="210" y="300" text-anchor="middle" stroke="none">knowledge: facts</text>
  <text x="210" y="316" text-anchor="middle" stroke="none">verified in code</text>

  <!-- the type that holds what is unclear -->
  <rect x="60" y="396" width="300" height="46" fill="#fff" stroke-width="1.5"/>
  <text x="210" y="416" text-anchor="middle" stroke="none">the type that holds</text>
  <text x="210" y="432" text-anchor="middle" stroke="none">what is unclear</text>

  <!-- Field -->
  <rect x="40" y="530" width="160" height="46" fill="#fff" stroke-width="1.5"/>
  <text x="120" y="558" text-anchor="middle" stroke="none">Field</text>

  <!-- a periodic book or audit -->
  <rect x="240" y="530" width="165" height="46" fill="#fff" stroke-width="1.5"/>
  <text x="322" y="547" text-anchor="middle" stroke="none">a periodic book</text>
  <text x="322" y="565" text-anchor="middle" stroke="none">or audit</text>

  <!-- arrows -->
  <path d="M210,60 V120" fill="none" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="198" y="84" text-anchor="end" stroke="none">reviews psyche</text>
  <text x="198" y="102" text-anchor="end" stroke="none">proposals, line by line</text>

  <path d="M310,38 H370 V250" fill="none" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="360" y="84" text-anchor="end" stroke="none">skims knowledge</text>
  <text x="360" y="102" text-anchor="end" stroke="none">proposals</text>

  <path d="M210,180 V250" fill="none" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="198" y="200" text-anchor="end" stroke="none">rules over Mind:</text>
  <text x="198" y="216" text-anchor="end" stroke="none">a Mind line it</text>
  <text x="198" y="232" text-anchor="end" stroke="none">contradicts is removed</text>

  <path d="M210,326 V396" fill="none" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="222" y="350" stroke="none">an audit for truth</text>
  <text x="222" y="366" stroke="none">and currency finds</text>
  <text x="222" y="382" stroke="none">a variation; it goes to</text>

  <path d="M120,456 V530" fill="none" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="130" y="480" stroke="none">rules over Field:</text>
  <text x="130" y="498" stroke="none">a Field line it</text>
  <text x="130" y="516" stroke="none">contradicts is removed</text>

  <path d="M240,553 H200" fill="none" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="220" y="606" text-anchor="middle" stroke="none">reads it as a whole and</text>
  <text x="220" y="624" text-anchor="middle" stroke="none">checks it against Mind and Psyche</text>
</svg>
