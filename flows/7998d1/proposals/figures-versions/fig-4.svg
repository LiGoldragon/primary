<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 520" width="380" height="520" font-family="sans-serif" font-size="16">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <!-- boxes -->
  <rect x="40" y="20" width="300" height="50" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="190" y="51" text-anchor="middle" fill="#000">his vision</text>

  <rect x="40" y="150" width="300" height="70" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="190" y="179" text-anchor="middle" fill="#000">a proposal</text>
  <text x="190" y="201" text-anchor="middle" fill="#000">(the proposal module's rules)</text>

  <rect x="40" y="300" width="300" height="70" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="190" y="329" text-anchor="middle" fill="#000">a book</text>
  <text x="190" y="351" text-anchor="middle" fill="#000">(the book module's rules)</text>

  <rect x="40" y="440" width="300" height="50" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="190" y="471" text-anchor="middle" fill="#000">him</text>

  <!-- arrows -->
  <line x1="190" y1="70" x2="190" y2="150" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="202" y="115" fill="#000">is made into</text>

  <line x1="190" y1="220" x2="190" y2="300" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="202" y="265" fill="#000">is rendered as</text>

  <line x1="190" y1="370" x2="190" y2="440" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="202" y="410" fill="#000">is shown to</text>
</svg>
