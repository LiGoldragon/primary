<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 660" width="400" height="660" font-family="sans-serif">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="400" height="660" fill="#ffffff"/>
  <g fill="#f2f2f2" stroke="#333" stroke-width="2">
    <rect x="50" y="30" width="300" height="70" rx="8"/>
    <rect x="50" y="200" width="300" height="70" rx="8"/>
    <rect x="20" y="360" width="360" height="130" rx="8"/>
    <rect x="50" y="570" width="300" height="70" rx="8"/>
  </g>
  <g fill="none" stroke="#333" stroke-width="2">
    <line x1="200" y1="100" x2="200" y2="200" marker-end="url(#head)"/>
    <line x1="200" y1="270" x2="200" y2="360" marker-end="url(#head)"/>
    <line x1="200" y1="490" x2="200" y2="570" marker-end="url(#head)"/>
  </g>
  <g fill="#111111" font-size="19">
    <text x="200" y="72" text-anchor="middle" font-size="22">Flow Nexus</text>
    <text x="216" y="138">warns, before</text>
    <text x="216" y="164">the threshold</text>
    <text x="200" y="242" text-anchor="middle" font-size="22">the flow</text>
    <text x="216" y="320">writes</text>
    <text x="200" y="413" text-anchor="middle">handover: its judgment on</text>
    <text x="200" y="440" text-anchor="middle">what it is still trying to do</text>
    <text x="216" y="530">first prompt of</text>
    <text x="200" y="612" text-anchor="middle" font-size="22">the successor, fresh</text>
  </g>
</svg>
