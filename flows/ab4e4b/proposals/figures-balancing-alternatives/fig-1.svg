<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 460" width="420" height="460" font-family="sans-serif">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect x="60" y="20" width="300" height="70" rx="6" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="210" y="62" font-size="20" text-anchor="middle" fill="#000">A. Energy alone</text>
  <line x1="210" y1="90" x2="210" y2="188" stroke="#000" stroke-width="2" marker-end="url(#head)"/>
  <text x="230" y="131" font-size="17" fill="#000">and the machine's</text>
  <text x="230" y="153" font-size="17" fill="#000">resources</text>
  <rect x="60" y="190" width="300" height="70" rx="6" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="210" y="232" font-size="20" text-anchor="middle" fill="#000">B. Energy and resources</text>
  <line x1="210" y1="260" x2="210" y2="358" stroke="#000" stroke-width="2" marker-end="url(#head)"/>
  <text x="230" y="301" font-size="17" fill="#000">and rhythm, what is</text>
  <text x="230" y="323" font-size="17" fill="#000">left lying, itself</text>
  <rect x="60" y="360" width="300" height="70" rx="6" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="210" y="402" font-size="20" text-anchor="middle" fill="#000">C. The whole body</text>
</svg>
