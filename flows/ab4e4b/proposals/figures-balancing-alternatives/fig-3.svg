<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black"/>
    </marker>
  </defs>
  <rect x="30" y="20" width="340" height="60" rx="6" fill="white" stroke="black" stroke-width="2"/>
  <text x="200" y="56" font-size="18" text-anchor="middle" fill="black">A. It tells</text>

  <rect x="30" y="170" width="340" height="90" rx="6" fill="white" stroke="black" stroke-width="2"/>
  <text x="200" y="205" font-size="18" text-anchor="middle" fill="black">B. It holds: nothing</text>
  <text x="200" y="232" font-size="18" text-anchor="middle" fill="black">ended, nothing lost</text>

  <rect x="30" y="320" width="340" height="60" rx="6" fill="white" stroke="black" stroke-width="2"/>
  <text x="200" y="356" font-size="18" text-anchor="middle" fill="black">C. It stops and rolls back</text>

  <line x1="200" y1="80" x2="200" y2="170" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="212" y="130" font-size="16" fill="black">and may also</text>

  <line x1="200" y1="260" x2="200" y2="320" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="212" y="295" font-size="16" fill="black">and may also</text>
</svg>
