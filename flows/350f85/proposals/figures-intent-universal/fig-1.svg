<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" width="600" height="760" font-family="sans-serif" font-size="24">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect x="90" y="30" width="420" height="80" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="300" y="60" text-anchor="middle" fill="#000">inputs: source, toolchain,</text>
  <text x="300" y="88" text-anchor="middle" fill="#000">dependency set</text>
  <line x1="300" y1="110" x2="300" y2="190" stroke="#000" stroke-width="2" marker-end="url(#arr)"/>
  <text x="316" y="156" fill="#000">name</text>
  <rect x="90" y="190" width="420" height="60" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="300" y="228" text-anchor="middle" fill="#000">one derivation</text>
  <line x1="300" y1="250" x2="300" y2="340" stroke="#000" stroke-width="2" marker-end="url(#arr)"/>
  <text x="316" y="298" fill="#000">has, on every host</text>
  <rect x="90" y="340" width="420" height="60" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="300" y="378" text-anchor="middle" fill="#000">one store path</text>
  <rect x="90" y="500" width="420" height="60" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="300" y="538" text-anchor="middle" fill="#000">a change to one input</text>
  <line x1="300" y1="560" x2="300" y2="650" stroke="#000" stroke-width="2" marker-end="url(#arr)"/>
  <text x="316" y="608" fill="#000">rebuilds</text>
  <rect x="90" y="650" width="420" height="80" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="300" y="681" text-anchor="middle" fill="#000">that derivation and its</text>
  <text x="300" y="709" text-anchor="middle" fill="#000">dependents, nothing else</text>
