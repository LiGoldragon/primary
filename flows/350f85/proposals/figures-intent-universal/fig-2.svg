<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" font-family="sans-serif" font-size="18">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="600" height="900" fill="#fff"/>

  <!-- boxes -->
  <rect x="150" y="20" width="300" height="64" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="300" y="58" text-anchor="middle" fill="#000">a Primary driving a fix</text>

  <rect x="150" y="300" width="300" height="64" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="300" y="338" text-anchor="middle" fill="#000">every step in order</text>

  <rect x="10" y="500" width="260" height="72" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="140" y="543" text-anchor="middle" fill="#000">who holds each</text>

  <rect x="330" y="500" width="260" height="72" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="460" y="543" text-anchor="middle" fill="#000">the beat that measures it</text>

  <rect x="150" y="740" width="300" height="64" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="300" y="778" text-anchor="middle" fill="#000">it says nothing blocks on it</text>

  <!-- arrows -->
  <line x1="300" y1="84" x2="300" y2="300" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="316" y="196" fill="#000">briefs from its first turn</text>

  <line x1="260" y1="364" x2="140" y2="500" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="188" y="426" text-anchor="end" fill="#000">names</text>

  <line x1="340" y1="364" x2="460" y2="500" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="412" y="426" fill="#000">names</text>

  <line x1="140" y1="572" x2="220" y2="740" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="88" y="643" width="184" height="26" fill="#fff"/>
  <text x="180" y="662" text-anchor="middle" fill="#000">all briefed before</text>

  <line x1="460" y1="572" x2="380" y2="740" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="328" y="643" width="184" height="26" fill="#fff"/>
  <text x="420" y="662" text-anchor="middle" fill="#000">all briefed before</text>
</svg>
