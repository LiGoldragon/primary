<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 540" width="480" height="540" font-family="sans-serif" font-size="18" fill="#000">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <!-- boxes -->
  <rect x="90" y="20" width="300" height="90" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="240" y="56" text-anchor="middle">a metaflow,</text>
  <text x="240" y="82" text-anchor="middle">configured in datom</text>

  <rect x="20" y="230" width="200" height="70" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="120" y="271" text-anchor="middle">model</text>

  <rect x="246" y="230" width="228" height="70" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="360" y="262" text-anchor="middle">routes:</text>
  <text x="360" y="284" text-anchor="middle">who speaks to whom</text>

  <rect x="20" y="400" width="200" height="110" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="120" y="436" text-anchor="middle">personality:</text>
  <text x="120" y="460" text-anchor="middle">what it designs,</text>
  <text x="120" y="484" text-anchor="middle">does, speaks</text>

  <!-- arrows -->
  <line x1="150" y1="110" x2="120" y2="230" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="118" y="160" text-anchor="end">names each</text>
  <text x="118" y="182" text-anchor="end">member's</text>

  <line x1="330" y1="110" x2="360" y2="230" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="352" y="165" text-anchor="start">names</text>

  <line x1="120" y1="300" x2="120" y2="400" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="132" y="355" text-anchor="start">has</text>
</svg>
