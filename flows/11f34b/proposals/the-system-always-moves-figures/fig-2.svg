<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 610" width="360" height="610" font-family="sans-serif" font-size="17">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <g fill="#fff" stroke="#000" stroke-width="2">
    <rect x="20" y="30" width="280" height="56"/>
    <rect x="20" y="194" width="280" height="56"/>
    <rect x="20" y="300" width="280" height="56"/>
    <rect x="20" y="414" width="280" height="56"/>
    <rect x="20" y="528" width="280" height="56"/>
  </g>
  <g fill="#000" text-anchor="middle">
    <text x="160" y="64">a flow that is stuck</text>
    <text x="160" y="228">the system</text>
    <text x="160" y="334">a change that may fail</text>
    <text x="160" y="448">a catch under it</text>
    <text x="160" y="562">the change is made</text>
  </g>
  <g stroke="#000" stroke-width="2" fill="none">
    <line x1="110" y1="86" x2="110" y2="194" marker-end="url(#ah)"/>
    <line x1="210" y1="194" x2="210" y2="86" marker-end="url(#ah)"/>
    <line x1="160" y1="356" x2="160" y2="414" marker-end="url(#ah)"/>
    <line x1="160" y1="470" x2="160" y2="528" marker-end="url(#ah)"/>
  </g>
  <g fill="#000">
    <text x="100" y="146" text-anchor="end">says so to</text>
    <text x="220" y="136">frees, before</text>
    <text x="220" y="158">anything else</text>
    <text x="172" y="391">gets</text>
    <text x="172" y="505">and then</text>
