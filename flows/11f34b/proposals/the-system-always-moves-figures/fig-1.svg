<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 810" width="400" height="810" font-family="sans-serif" font-size="18" fill="#000" stroke="#000">
  <defs>
    <marker id="head" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#000" stroke="none"/>
    </marker>
  </defs>

  <!-- boxes -->
  <rect x="20" y="20" width="360" height="52" fill="#fff" stroke-width="2"/>
  <text x="200" y="52" text-anchor="middle" stroke="none">thinking machine</text>

  <rect x="20" y="152" width="360" height="52" fill="#fff" stroke-width="2"/>
  <text x="200" y="184" text-anchor="middle" stroke="none">flows, arranged in a structure</text>

  <rect x="20" y="314" width="360" height="52" fill="#fff" stroke-width="2"/>
  <text x="200" y="346" text-anchor="middle" stroke="none">one self</text>

  <rect x="20" y="446" width="360" height="52" fill="#fff" stroke-width="2"/>
  <text x="200" y="478" text-anchor="middle" stroke="none">an aspect</text>

  <rect x="20" y="578" width="360" height="52" fill="#fff" stroke-width="2"/>
  <text x="200" y="610" text-anchor="middle" stroke="none">my mind, my field, my psyche</text>

  <rect x="20" y="710" width="360" height="80" fill="#fff" stroke-width="2"/>
  <text x="200" y="740" text-anchor="middle" stroke="none">everything every other flow says,</text>
  <text x="200" y="766" text-anchor="middle" stroke="none">does or leaves undone</text>

  <!-- verbed arrows -->
  <line x1="110" y1="72" x2="110" y2="152" stroke-width="2" marker-end="url(#head)"/>
  <text x="130" y="118" stroke="none" font-size="17">is many</text>

  <line x1="110" y1="204" x2="110" y2="314" stroke-width="2" marker-end="url(#head)"/>
  <text x="130" y="252" stroke="none" font-size="17">speak to one another,</text>
  <text x="130" y="276" stroke="none" font-size="17">together are</text>

  <line x1="110" y1="366" x2="110" y2="446" stroke-width="2" marker-end="url(#head)"/>
  <text x="130" y="412" stroke="none" font-size="17">has each flow as</text>

  <line x1="110" y1="498" x2="110" y2="578" stroke-width="2" marker-end="url(#head)"/>
  <text x="130" y="544" stroke="none" font-size="17">names the others as its own</text>

  <line x1="110" y1="630" x2="110" y2="710" stroke-width="2" marker-end="url(#head)"/>
  <text x="130" y="676" stroke="none" font-size="17">answers for</text>
</svg>
