<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 660" width="480" height="660" font-family="sans-serif" font-size="20">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
  </defs>

  <!-- boxes -->
  <rect x="90" y="30" width="300" height="70" rx="6" fill="white" stroke="black" stroke-width="2"/>
  <text x="240" y="72" text-anchor="middle" fill="black">a Primary driving a fix</text>

  <rect x="90" y="190" width="300" height="70" rx="6" fill="white" stroke="black" stroke-width="2"/>
  <text x="240" y="232" text-anchor="middle" fill="black">every step in order</text>

  <rect x="10" y="350" width="220" height="70" rx="6" fill="white" stroke="black" stroke-width="2"/>
  <text x="120" y="392" text-anchor="middle" fill="black">who holds each</text>

  <rect x="250" y="350" width="220" height="70" rx="6" fill="white" stroke="black" stroke-width="2"/>
  <text x="360" y="380" text-anchor="middle" fill="black">the beat that</text>
  <text x="360" y="404" text-anchor="middle" fill="black">measures it</text>

  <rect x="90" y="540" width="300" height="90" rx="6" fill="white" stroke="black" stroke-width="2"/>
  <text x="240" y="578" text-anchor="middle" fill="black">it says nothing</text>
  <text x="240" y="604" text-anchor="middle" fill="black">blocks on it</text>

  <!-- arrows with verbs -->
  <line x1="240" y1="100" x2="240" y2="190" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
  <text x="256" y="140" fill="black" font-size="18">briefs from</text>
  <text x="256" y="162" fill="black" font-size="18">its first turn</text>

  <line x1="150" y1="260" x2="120" y2="350" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
  <text x="100" y="300" text-anchor="end" fill="black" font-size="18">names</text>

  <line x1="330" y1="260" x2="360" y2="350" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
  <text x="400" y="300" fill="black" font-size="18">names</text>

  <line x1="120" y1="420" x2="120" y2="540" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
  <text x="108" y="470" text-anchor="end" fill="black" font-size="18">all briefed</text>
  <text x="108" y="492" text-anchor="end" fill="black" font-size="18">before</text>

  <line x1="360" y1="420" x2="360" y2="540" stroke="black" stroke-width="2" marker-end="url(#ah)"/>
  <text x="372" y="470" fill="black" font-size="18">all briefed</text>
  <text x="372" y="492" fill="black" font-size="18">before</text>
</svg>
