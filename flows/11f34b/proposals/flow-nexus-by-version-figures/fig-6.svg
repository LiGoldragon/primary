<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 530" width="400" height="530" font-family="sans-serif" font-size="17">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect x="80" y="20" width="240" height="60" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="200" y="56" text-anchor="middle" fill="#000">flow's response, as text</text>

  <line x1="200" y1="80" x2="200" y2="180" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="212" y="118" fill="#000">Report,</text>
  <text x="212" y="140" fill="#000">from the hook</text>

  <rect x="135" y="180" width="130" height="52" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="200" y="211" text-anchor="middle" fill="#000">translator</text>

  <polyline points="150,232 150,280 100,280 100,320" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="140" y="246" text-anchor="end" fill="#000">actualizes as</text>
  <text x="140" y="266" text-anchor="end" fill="#000">Input?</text>

  <polyline points="250,232 250,280 300,280 300,320" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="262" y="262" fill="#000">no</text>

  <rect x="10" y="320" width="180" height="70" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="100" y="350" text-anchor="middle" fill="#000">yes: the Input,</text>
  <text x="100" y="374" text-anchor="middle" fill="#000">as signal</text>

  <rect x="210" y="320" width="180" height="70" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="300" y="350" text-anchor="middle" fill="#000">Heard: kept,</text>
  <text x="300" y="374" text-anchor="middle" fill="#000">nothing acted</text>

  <line x1="100" y1="390" x2="100" y2="450" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="10" y="450" width="180" height="60" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="100" y="486" text-anchor="middle" fill="#000">Flow Nexus acts</text>
</svg>
