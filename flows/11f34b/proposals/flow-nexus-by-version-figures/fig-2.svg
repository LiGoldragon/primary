<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520" font-family="sans-serif" font-size="18">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black"/>
    </marker>
  </defs>
  <rect x="50" y="30" width="300" height="60" fill="white" stroke="black" stroke-width="2"/>
  <text x="200" y="67" text-anchor="middle" fill="black">Flow</text>

  <line x1="200" y1="90" x2="200" y2="228" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="216" y="152" fill="black">composes into</text>
  <text x="216" y="176" fill="black">the first prompt</text>

  <rect x="50" y="230" width="300" height="100" fill="white" stroke="black" stroke-width="2"/>
  <text x="200" y="274" text-anchor="middle" fill="black">belief modules of any kind</text>
  <text x="200" y="300" text-anchor="middle" fill="black">except spirit and intent</text>

  <line x1="200" y1="330" x2="200" y2="428" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="216" y="385" fill="black">starts</text>

  <rect x="50" y="430" width="300" height="60" fill="white" stroke="black" stroke-width="2"/>
  <text x="200" y="467" text-anchor="middle" fill="black">a fresh flow</text>
</svg>
