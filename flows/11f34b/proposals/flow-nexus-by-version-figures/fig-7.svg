<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 660" width="600" height="660" font-family="sans-serif" font-size="18">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="black" stroke="black"/>
    </marker>
  </defs>

  <!-- solid: roster in the first prompt, each change pushed -->
  <line x1="300" y1="76" x2="300" y2="200" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="312" y="128" fill="black">roster in the first prompt,</text>
  <text x="312" y="148" fill="black">each change pushed</text>

  <!-- solid: Send -->
  <line x1="300" y1="256" x2="300" y2="370" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="312" y="346" fill="black">Send</text>

  <!-- solid: answers as a message (loop back on the left) -->
  <polyline points="180,398 150,398 150,228 180,228" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="138" y="305" text-anchor="end" fill="black">answers as</text>
  <text x="138" y="327" text-anchor="end" fill="black">a message</text>

  <!-- dotted: only if no running flow holds the work -->
  <polyline points="420,228 510,228 510,370" fill="none" stroke="black" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="498" y="284" text-anchor="end" fill="black">only if no running</text>
  <text x="498" y="304" text-anchor="end" fill="black">flow holds the work</text>

  <!-- solid: past threshold, replaced by -->
  <line x1="300" y1="426" x2="300" y2="580" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="312" y="490" fill="black">past threshold,</text>
  <text x="312" y="510" fill="black">replaced by</text>

  <!-- boxes -->
  <rect x="180" y="20" width="240" height="56" fill="#fff" stroke="black" stroke-width="2"/>
  <text x="300" y="54" text-anchor="middle" fill="black">the Flow Nexus</text>

  <rect x="180" y="200" width="240" height="56" fill="#fff" stroke="black" stroke-width="2"/>
  <text x="300" y="234" text-anchor="middle" fill="black">any flow</text>

  <rect x="180" y="370" width="240" height="56" fill="#fff" stroke="black" stroke-width="2"/>
  <text x="300" y="404" text-anchor="middle" fill="black">permanent flow, hot</text>

  <rect x="440" y="370" width="140" height="56" fill="#fff" stroke="black" stroke-width="2"/>
  <text x="510" y="394" text-anchor="middle" fill="black">harness</text>
  <text x="510" y="414" text-anchor="middle" fill="black">subagent</text>

  <rect x="180" y="580" width="240" height="56" fill="#fff" stroke="black" stroke-width="2"/>
  <text x="300" y="601" text-anchor="middle" fill="black">successor, from</text>
  <text x="300" y="621" text-anchor="middle" fill="black">its modules</text>
</svg>
