<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 580" width="420" height="580" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="black" stroke="none"/>
    </marker>
  </defs>
  <rect x="10" y="20" width="190" height="80" fill="white" stroke="black" stroke-width="2"/>
  <text x="105" y="52" font-size="16" text-anchor="middle" fill="black">Memory:</text>
  <text x="105" y="78" font-size="16" text-anchor="middle" fill="black">each flow's state</text>
  <rect x="220" y="20" width="190" height="80" fill="white" stroke="black" stroke-width="2"/>
  <text x="315" y="66" font-size="16" text-anchor="middle" fill="black">Broadcast.Request</text>
  <rect x="110" y="260" width="200" height="70" fill="white" stroke="black" stroke-width="2"/>
  <text x="210" y="302" font-size="16" text-anchor="middle" fill="black">the hot flows</text>
  <rect x="40" y="470" width="340" height="80" fill="white" stroke="black" stroke-width="2"/>
  <text x="210" y="516" font-size="16" text-anchor="middle" fill="black">Broadcast.Vector of FlowId</text>
  <line x1="105" y1="100" x2="150" y2="260" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="115" y="180" font-size="15" text-anchor="end" fill="black">Running</text>
  <text x="115" y="200" font-size="15" text-anchor="end" fill="black">or Idle</text>
  <line x1="315" y1="100" x2="270" y2="260" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="305" y="180" font-size="15" text-anchor="start" fill="black">one prompt</text>
  <text x="305" y="200" font-size="15" text-anchor="start" fill="black">into each</text>
  <line x1="210" y1="330" x2="210" y2="470" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="222" y="405" font-size="15" text-anchor="start" fill="black">who received it</text>
</svg>
