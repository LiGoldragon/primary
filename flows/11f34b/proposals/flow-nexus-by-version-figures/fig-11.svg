<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 490" width="360" height="490" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <!-- boxes -->
  <rect x="40" y="20" width="280" height="50" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="180" y="51" font-size="16" text-anchor="middle" fill="#000">a flow driving a fix</text>
  <rect x="60" y="150" width="240" height="50" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="180" y="181" font-size="16" text-anchor="middle" fill="#000">every step in order</text>
  <rect x="10" y="290" width="160" height="55" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="90" y="323" font-size="16" text-anchor="middle" fill="#000">who holds each</text>
  <rect x="190" y="290" width="160" height="55" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="270" y="309" font-size="16" text-anchor="middle" fill="#000">the beat that</text>
  <text x="270" y="330" font-size="16" text-anchor="middle" fill="#000">measures it</text>
  <rect x="40" y="420" width="280" height="50" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="180" y="451" font-size="16" text-anchor="middle" fill="#000">it says nothing blocks on it</text>
  <!-- arrows -->
  <line x1="180" y1="70" x2="180" y2="150" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="70" y="100" width="220" height="22" fill="#fff"/>
  <text x="180" y="116" font-size="15" text-anchor="middle" fill="#000">briefs from its first turn</text>
  <line x1="140" y1="200" x2="90" y2="290" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="92" y="234" width="46" height="22" fill="#fff"/>
  <text x="115" y="250" font-size="15" text-anchor="middle" fill="#000">names</text>
  <line x1="220" y1="200" x2="270" y2="290" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="222" y="234" width="46" height="22" fill="#fff"/>
  <text x="245" y="250" font-size="15" text-anchor="middle" fill="#000">names</text>
  <line x1="90" y1="345" x2="90" y2="420" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="10" y="371" width="160" height="22" fill="#fff"/>
  <text x="90" y="387" font-size="15" text-anchor="middle" fill="#000">all briefed before</text>
  <line x1="270" y1="345" x2="270" y2="420" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="190" y="371" width="160" height="22" fill="#fff"/>
  <text x="270" y="387" font-size="15" text-anchor="middle" fill="#000">all briefed before</text>
</svg>
