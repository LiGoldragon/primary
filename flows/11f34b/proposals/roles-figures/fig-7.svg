<svg xmlns="http://www.w3.org/2000/svg" width="520" height="400" viewBox="0 0 520 400" font-family="sans-serif" font-size="16">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <g transform="translate(40,0)">
  <rect x="20" y="20" width="180" height="110" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="110" y="58" text-anchor="middle" fill="#000">default modules:</text>
  <text x="110" y="80" text-anchor="middle" fill="#000">the Nexus's one</text>
  <text x="110" y="102" text-anchor="middle" fill="#000">configured list</text>
  <rect x="240" y="20" width="180" height="110" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="330" y="70" text-anchor="middle" fill="#000">the member's own</text>
  <text x="330" y="92" text-anchor="middle" fill="#000">Beliefs</text>
  <rect x="120" y="260" width="200" height="80" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="220" y="305" text-anchor="middle" fill="#000">the flow's workspace</text>
  <line x1="110" y1="130" x2="150" y2="260" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="118" y="200" text-anchor="end" fill="#000">composed first</text>
  <line x1="330" y1="130" x2="290" y2="260" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="322" y="200" text-anchor="start" fill="#000">composed after</text>
  </g>
</svg>
