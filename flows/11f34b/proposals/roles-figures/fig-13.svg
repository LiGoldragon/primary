<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440" width="360" height="440" font-family="sans-serif" fill="black">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="320" height="60" fill="white" stroke="black" stroke-width="2"/>
  <text x="180" y="57" font-size="20" text-anchor="middle">Flow</text>

  <line x1="180" y1="80" x2="180" y2="160" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="195" y="117" font-size="18">composes into</text>
  <text x="195" y="139" font-size="18">the first prompt</text>

  <rect x="20" y="160" width="320" height="110" fill="white" stroke="black" stroke-width="2"/>
  <text x="180" y="208" font-size="20" text-anchor="middle">belief modules of any</text>
  <text x="180" y="236" font-size="20" text-anchor="middle">kind except spirit and intent</text>

  <line x1="180" y1="270" x2="180" y2="350" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="195" y="315" font-size="18">starts</text>

  <rect x="20" y="350" width="320" height="60" fill="white" stroke="black" stroke-width="2"/>
  <text x="180" y="387" font-size="20" text-anchor="middle">a fresh flow</text>
</svg>
