      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <g stroke="#000" stroke-width="2" fill="none">
    <line x1="220" y1="76" x2="220" y2="150" marker-end="url(#a)"/>
    <line x1="160" y1="206" x2="160" y2="310" marker-end="url(#a)"/>
