<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 660" width="480" height="660" font-family="sans-serif" font-size="17">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <g fill="#fff" stroke="#000" stroke-width="2">
    <rect x="20" y="20" width="320" height="60"/>
    <rect x="20" y="190" width="320" height="100"/>
    <rect x="20" y="370" width="320" height="80"/>
    <rect x="20" y="540" width="320" height="60"/>
  </g>
  <g fill="#000" text-anchor="middle">
    <text x="180" y="56">a metaflow, configured in datom</text>
    <text x="180" y="222">model: Fable, Opus, Sonnet,</text>
    <text x="180" y="248">Haiku, Astra, Sol, Luna, Terra</text>
    <text x="180" y="402">personality: what it designs,</text>
    <text x="180" y="428">does, speaks</text>
    <text x="180" y="576">routes: who speaks to whom</text>
  </g>
  <g stroke="#000" stroke-width="2" fill="none">
    <line x1="180" y1="80" x2="180" y2="190" marker-end="url(#arrow)"/>
    <line x1="180" y1="290" x2="180" y2="370" marker-end="url(#arrow)"/>
    <polyline points="340,50 440,50 440,570 340,570" marker-end="url(#arrow)"/>
  </g>
  <g fill="#000" font-size="16">
    <text x="190" y="140">names each member's</text>
    <text x="190" y="335">has</text>
    <text x="430" y="315" text-anchor="end">names</text>
  </g>
</svg>
