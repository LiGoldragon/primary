<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480" font-family="sans-serif" font-size="15">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
  </defs>
  <!-- boxes -->
  <rect x="15" y="20" width="170" height="120" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="100" y="46" text-anchor="middle" fill="black">
    <tspan x="100" dy="0">a role file:</tspan>
    <tspan x="100" dy="19">trained well, no</tspan>
    <tspan x="100" dy="19">further than the</tspan>
    <tspan x="100" dy="19">work needs</tspan>
  </text>
  <rect x="210" y="20" width="170" height="60" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="295" y="56" text-anchor="middle" fill="black">a flow</text>
  <rect x="105" y="380" width="170" height="70" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="190" y="410" text-anchor="middle" fill="black">
    <tspan x="190" dy="0">a specialized</tspan>
    <tspan x="190" dy="19">subflow</tspan>
  </text>
  <!-- arrows -->
  <line x1="100" y1="140" x2="150" y2="380" stroke="black" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="250" y1="80" x2="230" y2="380" stroke="black" stroke-width="1.5" marker-end="url(#ah)"/>
  <polyline points="275,415 360,415 360,80" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#ah)"/>
  <!-- edge labels -->
  <text x="115" y="262" text-anchor="end" fill="black">starts</text>
  <text x="236" y="150" text-anchor="end" fill="black">directs, in one</text>
  <text x="236" y="170" text-anchor="end" fill="black">short paragraph</text>
  <text x="350" y="230" text-anchor="end" fill="black">answers, and</text>
  <text x="350" y="250" text-anchor="end" fill="black">is trusted</text>
</svg>
