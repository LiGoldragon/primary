<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 480" width="540" height="480" font-family="sans-serif" font-size="16">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
  </defs>
  <g fill="white" stroke="black" stroke-width="2">
    <rect x="160" y="20" width="200" height="50"/>
    <rect x="160" y="130" width="200" height="50"/>
    <rect x="385" y="20" width="135" height="50"/>
    <rect x="40" y="260" width="160" height="50"/>
    <rect x="300" y="260" width="160" height="50"/>
    <rect x="40" y="380" width="200" height="70"/>
  </g>
  <g fill="black" text-anchor="middle">
