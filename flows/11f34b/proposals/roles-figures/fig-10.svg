<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" width="360" height="290" font-family="sans-serif" font-size="15" fill="black">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black"/>
    </marker>
  </defs>
  <!-- a: Nexus 0.48, running -->
  <rect x="20" y="30" width="130" height="60" fill="white" stroke="black" stroke-width="2"/>
  <text x="85" y="56" text-anchor="middle">Nexus 0.48,</text>
  <text x="85" y="76" text-anchor="middle">running</text>
  <!-- x: blank end state -->
  <rect x="240" y="30" width="60" height="60" fill="white" stroke="black" stroke-width="2"/>
  <!-- b: Nexus 0.49 -->
  <rect x="20" y="200" width="130" height="60" fill="white" stroke="black" stroke-width="2"/>
  <text x="85" y="236" text-anchor="middle">Nexus 0.49</text>
  <!-- f: every running flow -->
  <rect x="210" y="200" width="130" height="60" fill="white" stroke="black" stroke-width="2"/>
  <text x="275" y="228" text-anchor="middle">every running</text>
  <text x="275" y="248" text-anchor="middle">flow</text>
  <!-- a -> x: empty, stopped -->
  <line x1="150" y1="82" x2="240" y2="82" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="195" y="56" text-anchor="middle">empty,</text>
  <text x="195" y="72" text-anchor="middle">stopped</text>
  <!-- a -> b: 0.49 started beside it -->
  <line x1="85" y1="90" x2="85" y2="200" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="95" y="140" text-anchor="start">0.49 started</text>
  <text x="95" y="160" text-anchor="start">beside it</text>
  <!-- f -> b: Adopt -->
  <line x1="210" y1="230" x2="150" y2="230" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="180" y="221" text-anchor="middle">Adopt</text>
</svg>
