<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560" font-family="sans-serif" font-size="15">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <!-- r -> a -->
  <line x1="100" y1="120" x2="100" y2="470" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="88" y="270" text-anchor="end" fill="#000">is open</text>
  <text x="88" y="289" text-anchor="end" fill="#000">until</text>
  <!-- f -> s -->
  <line x1="295" y1="120" x2="295" y2="290" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="285" y="180" text-anchor="end" fill="#000">the Nexus carries,</text>
  <text x="285" y="198" text-anchor="end" fill="#000">with the handover</text>
  <!-- s -> a -->
  <line x1="200" y1="400" x2="165" y2="470" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="215" y="445" fill="#000">answers with</text>
  <!-- boxes -->
  <rect x="20" y="30" width="160" height="90" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="100" y="70" text-anchor="middle" fill="#000">a request delivered</text>
  <text x="100" y="92" text-anchor="middle" fill="#000">to the flow</text>
  <rect x="200" y="30" width="190" height="90" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="295" y="82" text-anchor="middle" fill="#000">the flow refreshes</text>
  <rect x="200" y="290" width="190" height="110" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="295" y="322" text-anchor="middle" fill="#000">the successor's first</text>
  <text x="295" y="342" text-anchor="middle" fill="#000">prompt: every open</text>
  <text x="295" y="362" text-anchor="middle" fill="#000">request, same ids</text>
  <rect x="20" y="470" width="160" height="70" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="100" y="500" text-anchor="middle" fill="#000">its Result or</text>
  <text x="100" y="520" text-anchor="middle" fill="#000">Done</text>
</svg>
