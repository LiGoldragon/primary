<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 540" width="440" height="540" font-family="sans-serif" font-size="16">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <!-- boxes -->
  <rect x="20" y="20" width="200" height="50" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="120" y="50" text-anchor="middle" fill="#000">the Flow Nexus</text>

  <rect x="20" y="160" width="200" height="50" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="120" y="190" text-anchor="middle" fill="#000">any flow</text>

  <rect x="20" y="300" width="200" height="60" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="120" y="335" text-anchor="middle" fill="#000">permanent flow, hot</text>

  <rect x="20" y="460" width="200" height="60" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="120" y="488" text-anchor="middle" fill="#000">successor, from</text>
  <text x="120" y="506" text-anchor="middle" fill="#000">its modules</text>

  <rect x="300" y="290" width="120" height="60" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="360" y="316" text-anchor="middle" fill="#000">harness</text>
  <text x="360" y="336" text-anchor="middle" fill="#000">subagent</text>

  <!-- arrows -->
  <path d="M120,70 L120,160" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="132" y="104" fill="#000">roster in the first prompt,</text>
  <text x="132" y="122" fill="#000">each change pushed</text>

  <path d="M90,210 L90,300" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="82" y="258" text-anchor="end" fill="#000">Send</text>

  <path d="M160,300 L160,210" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="170" y="245" fill="#000">answers as</text>
  <text x="170" y="263" fill="#000">a message</text>

  <path d="M220,185 L360,185 L360,290" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrow)"/>
  <text x="232" y="146" fill="#000">only if no running</text>
  <text x="232" y="164" fill="#000">flow holds the work</text>

  <path d="M120,360 L120,460" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="132" y="398" fill="#000">past threshold,</text>
  <text x="132" y="416" fill="#000">replaced by</text>
</svg>
