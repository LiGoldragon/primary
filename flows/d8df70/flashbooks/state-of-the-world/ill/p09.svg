<svg viewBox="0 0 600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Twelve chairs around a long table in a hall lit by one high window; eleven have a coat over the back, one is bare, and a coat lies folded on the floor beside it.">
<defs>
