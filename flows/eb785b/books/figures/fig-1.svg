<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 520" width="500" height="520" font-family="sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a94a0"/>
    </marker>
  </defs>

  <rect x="180" y="30" width="120" height="50" rx="6" fill="none" stroke="#8a94a0" stroke-width="2"/>
  <text x="240" y="60" text-anchor="middle" fill="#8a94a0" font-size="15">sender</text>

  <rect x="180" y="230" width="120" height="60" rx="6" fill="none" stroke="#8a94a0" stroke-width="2"/>
  <text x="240" y="265" text-anchor="middle" fill="#8a94a0" font-size="15">Flow</text>

  <rect x="180" y="440" width="120" height="50" rx="6" fill="none" stroke="#8a94a0" stroke-width="2"/>
  <text x="240" y="470" text-anchor="middle" fill="#8a94a0" font-size="15">receiver</text>

  <line x1="260" y1="80" x2="260" y2="228" stroke="#8a94a0" stroke-width="2" marker-end="url(#a)"/>
  <text x="270" y="155" fill="#8a94a0">Order.{ Minutes … }</text>

  <line x1="260" y1="290" x2="260" y2="438" stroke="#8a94a0" stroke-width="2" marker-end="url(#a)"/>
  <text x="270" y="345" fill="#8a94a0">Order.{ Minutes … }</text>

  <line x1="200" y1="230" x2="200" y2="82" stroke="#8a94a0" stroke-width="2" marker-end="url(#a)"/>
  <text x="190" y="110" text-anchor="end" fill="#8a94a0">Reminder.id</text>
  <text x="190" y="130" text-anchor="end" fill="#8a94a0" font-size="12">minutes lapse,</text>
  <text x="190" y="146" text-anchor="end" fill="#8a94a0" font-size="12">no Result</text>
  <text x="190" y="166" text-anchor="end" fill="#8a94a0" font-size="12">(Notice copy to receiver)</text>

  <text x="170" y="250" text-anchor="end" fill="#8a94a0" font-size="12">Task record:</text>
  <text x="170" y="266" text-anchor="end" fill="#8a94a0" font-size="12">id, sender,</text>
  <text x="170" y="282" text-anchor="end" fill="#8a94a0" font-size="12">receiver,</text>
  <text x="170" y="298" text-anchor="end" fill="#8a94a0" font-size="12">deadline, state</text>

  <polyline points="300,465 440,465 440,272 300,272" fill="none" stroke="#8a94a0" stroke-width="2" marker-end="url(#a)"/>
  <text x="432" y="400" text-anchor="end" fill="#8a94a0">Result.{ id … }</text>
  <text x="432" y="416" text-anchor="end" fill="#8a94a0">closes it</text>

  <polyline points="300,248 470,248 470,55 300,55" fill="none" stroke="#8a94a0" stroke-width="2" marker-end="url(#a)"/>
  <text x="462" y="95" text-anchor="end" fill="#8a94a0">Result.{ id … }</text>
  <text x="462" y="111" text-anchor="end" fill="#8a94a0">closes it</text>
</svg>
