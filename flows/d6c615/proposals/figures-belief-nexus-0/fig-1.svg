<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 710" width="440" height="710" font-family="sans-serif" fill="#000" stroke="#000">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000" stroke="none"/>
    </marker>
  </defs>

  <!-- boxes: things -->
  <rect x="30" y="20" width="260" height="70" fill="#fff" stroke-width="2"/>
  <text x="160" y="50" font-size="17" text-anchor="middle" stroke="none">sources: a repository,</text>
  <text x="160" y="70" font-size="17" text-anchor="middle" stroke="none">or a directory</text>

  <rect x="30" y="170" width="260" height="70" fill="#fff" stroke-width="2"/>
  <text x="160" y="200" font-size="17" text-anchor="middle" stroke="none">modules, each named by</text>
  <text x="160" y="220" font-size="17" text-anchor="middle" stroke="none">kind, topic and version</text>

  <rect x="30" y="320" width="260" height="70" fill="#fff" stroke-width="2"/>
  <text x="160" y="350" font-size="17" text-anchor="middle" stroke="none">a composition, saved</text>
  <text x="160" y="370" font-size="17" text-anchor="middle" stroke="none">under its name</text>

  <rect x="30" y="470" width="260" height="70" fill="#fff" stroke-width="2"/>
  <text x="160" y="500" font-size="17" text-anchor="middle" stroke="none">the workspace the</text>
  <text x="160" y="520" font-size="17" text-anchor="middle" stroke="none">Belief Nexus is handed</text>

  <rect x="30" y="620" width="260" height="70" fill="#fff" stroke-width="2"/>
  <text x="160" y="650" font-size="17" text-anchor="middle" stroke="none">every workspace it changed</text>
  <text x="160" y="670" font-size="17" text-anchor="middle" stroke="none">is furnished again</text>

  <!-- verbed arrows: one-way relations -->
  <line x1="160" y1="90" x2="160" y2="170" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="174" y="135" font-size="16" stroke="none">hold</text>

  <line x1="160" y1="240" x2="160" y2="320" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="174" y="285" font-size="16" stroke="none">are placed by</text>

  <line x1="160" y1="390" x2="160" y2="470" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="174" y="424" font-size="16" stroke="none">is written, for a flow</text>
  <text x="174" y="444" font-size="16" stroke="none">or a subagent, into</text>

  <path d="M290,55 H430 V655 H290" fill="none" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="418" y="350" font-size="16" text-anchor="end" stroke="none">a repository's</text>
  <text x="418" y="370" font-size="16" text-anchor="end" stroke="none">main moves</text>
</svg>
