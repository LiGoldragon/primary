<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400" font-family="sans-serif" font-size="16" fill="black">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
  </defs>
  <rect x="140" y="20" width="200" height="70" fill="white" stroke="black" stroke-width="2"/>
  <text x="240" y="48" text-anchor="middle">the Tailscale client,</text>
  <text x="240" y="72" text-anchor="middle">on each node</text>

  <rect x="10" y="270" width="180" height="100" fill="white" stroke="black" stroke-width="2"/>
  <text x="100" y="308" text-anchor="middle">the company's</text>
  <text x="100" y="332" text-anchor="middle">coordination server</text>

  <rect x="300" y="270" width="170" height="100" fill="white" stroke="black" stroke-width="2"/>
  <text x="385" y="308" text-anchor="middle">Headscale, on your</text>
  <text x="385" y="332" text-anchor="middle">own public node</text>

  <line x1="200" y1="90" x2="100" y2="266" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="150" y="140" text-anchor="end">is pointed</text>
  <text x="150" y="162" text-anchor="end">at one of</text>

  <line x1="280" y1="90" x2="385" y2="266" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="332" y="140">is pointed</text>
  <text x="332" y="162">at one of</text>

  <line x1="300" y1="320" x2="194" y2="320" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="245" y="312" text-anchor="middle">replaces</text>
</svg>
