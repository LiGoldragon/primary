<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 680" width="540" height="680" font-family="sans-serif" font-size="16">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect width="540" height="680" fill="#fff"/>

  <!-- boxes -->
  <rect x="30" y="20" width="240" height="70" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="150" y="47" text-anchor="middle" fill="#000">boot, resume,</text>
  <text x="150" y="69" text-anchor="middle" fill="#000">charger connected</text>

  <rect x="30" y="190" width="240" height="80" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="150" y="222" text-anchor="middle" fill="#000">Holding: between</text>
  <text x="150" y="244" text-anchor="middle" fill="#000">Resume and Limit</text>

  <rect x="30" y="380" width="240" height="80" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="150" y="412" text-anchor="middle" fill="#000">Calibrating: this</text>
  <text x="150" y="434" text-anchor="middle" fill="#000">charge goes to full</text>

  <rect x="30" y="560" width="240" height="80" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="150" y="592" text-anchor="middle" fill="#000">Returning: discharging,</text>
  <text x="150" y="614" text-anchor="middle" fill="#000">charger connected</text>

  <!-- arrows with verbs -->
  <line x1="150" y1="90" x2="150" y2="190" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="170" y="131" fill="#000">writes the levels again,</text>
  <text x="170" y="153" fill="#000">and reads them back</text>

  <line x1="150" y1="270" x2="150" y2="380" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="170" y="304" fill="#000">a charge begins, the last</text>
  <text x="170" y="326" fill="#000">full charge older than</text>
  <text x="170" y="348" fill="#000">FullEvery</text>

  <line x1="150" y1="460" x2="150" y2="560" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="170" y="511" fill="#000">the battery reports full</text>

  <path d="M270,600 H392 V230 H270" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="408" y="392" fill="#000">the level</text>
  <text x="408" y="414" fill="#000">reaches Limit</text>
</svg>
