<svg viewBox="0 0 360 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="p4t">
  <title id="p4t">One scroll, the transcript, lies open. A long brass pointer reaches across and rests on the stretch held between two red pins. A faded second copy of that stretch, drawn only as a ghost outline, is struck through: no copy travels.</title>
  <defs>
    <linearGradient id="p4-scroll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--paper-edge)"/>
      <stop offset=".5" style="stop-color:var(--paper)"/>
      <stop offset="1" style="stop-color:var(--paper-edge)"/>
    </linearGradient>
    <linearGradient id="p4-brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--brass)"/>
      <stop offset="1" style="stop-color:var(--glow)"/>
    </linearGradient>
    <radialGradient id="p4-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" style="stop-color:var(--glow);stop-opacity:.7"/>
      <stop offset="1" style="stop-color:var(--glow);stop-opacity:0"/>
    </radialGradient>
  </defs>
  <text x="180" y="44" text-anchor="middle" style="fill:var(--ink);font:italic 600 18px var(--display)">one copy, read where it lies</text>
  <!-- the one scroll, held at both ends -->
  <rect x="70" y="70" width="22" height="300" rx="11" style="fill:var(--wood)"/>
  <rect x="268" y="70" width="22" height="300" rx="11" style="fill:var(--wood)"/>
  <path d="M90 78 C 140 70, 220 86, 270 78 L 270 362 C 220 370, 140 354, 90 362 Z" style="fill:url(#p4-scroll);stroke:var(--ink);stroke-opacity:.25"/>
  <g style="fill:none;stroke:var(--muted);stroke-width:1.6;stroke-linecap:round;opacity:.6">
    <path d="M108 102 h 60"/><path d="M108 116 h 110"/><path d="M108 130 h 80"/>
    <path d="M108 318 h 90"/><path d="M108 332 h 54"/><path d="M108 346 h 120"/>
  </g>
  <ellipse cx="180" cy="224" rx="120" ry="80" style="fill:url(#p4-halo)"/>
  <path d="M102 152 h 156" style="stroke:var(--red);stroke-width:4;stroke-linecap:round"/>
  <path d="M102 296 h 156" style="stroke:var(--red);stroke-width:4;stroke-linecap:round"/>
  <circle cx="102" cy="152" r="6" style="fill:var(--red)"/>
  <circle cx="258" cy="296" r="6" style="fill:var(--red)"/>
  <g style="fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;opacity:.75">
    <path d="M114 182 c 10 -7 14 7 24 0 s 14 -9 24 0 s 12 7 24 -2 s 14 -7 24 0 s 10 4 18 0"/>
    <path d="M114 210 c 10 -7 14 7 24 0 s 14 -9 24 0 s 12 7 24 -2 s 12 -4 18 0"/>
    <path d="M114 238 c 10 -7 14 7 24 0 s 14 -9 24 0 s 12 7 24 -2 s 14 -7 24 0"/>
    <path d="M114 266 c 10 -7 14 7 24 0 s 14 -9 24 0 s 10 5 16 0"/>
  </g>
  <text x="180" y="392" text-anchor="middle" style="fill:var(--ink);font:600 13px var(--mono);font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0">Transcript · Block</text>
  <!-- the pointer reaching in from below -->
  <path d="M330 520 C 300 460, 250 380, 214 262" style="fill:none;stroke:url(#p4-brass);stroke-width:8;stroke-linecap:round"/>
  <path d="M206 248 L 224 266 L 210 270 Z" style="fill:var(--brass)"/>
  <circle cx="330" cy="522" r="10" style="fill:var(--wood-deep)"/>
  <!-- the ghost copy, struck through -->
  <g style="opacity:.5">
    <rect x="40" y="430" width="140" height="92" rx="3" style="fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 5"/>
    <g style="fill:none;stroke:var(--muted);stroke-width:1.6;stroke-linecap:round">
      <path d="M54 452 h 100"/><path d="M54 470 h 80"/><path d="M54 488 h 104"/><path d="M54 506 h 60"/>
    </g>
  </g>
  <path d="M30 532 L 190 420" style="stroke:var(--red);stroke-width:5;stroke-linecap:round"/>
  <text x="110" y="546" text-anchor="middle" style="fill:var(--muted);font:italic 400 14px var(--body)">no copy</text>
</svg>
