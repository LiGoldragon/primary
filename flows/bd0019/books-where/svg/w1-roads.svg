<svg viewBox="0 0 360 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="w1t">
  <title id="w1t">An open book lies at the foot of the page, its leaves lifting. Three roads of light rise from it. The left road climbs to a lit page hung like a window, with a small padlock: the private page. The middle road runs into a bound ledger held shut by a brass clasp: the committed Markdown. The right road thins out, and a few photographs, the screenshots, curl and fade into the air.</title>
  <defs>
    <radialGradient id="w1-sky" cx="50%" cy="38%" r="70%">
      <stop offset="0" style="stop-color:var(--glow);stop-opacity:.38"/>
      <stop offset="1" style="stop-color:var(--glow);stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="w1-road" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" style="stop-color:var(--glow);stop-opacity:.95"/>
      <stop offset="1" style="stop-color:var(--glow);stop-opacity:.15"/>
    </linearGradient>
    <linearGradient id="w1-fade" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" style="stop-color:var(--rule);stop-opacity:.9"/>
      <stop offset="1" style="stop-color:var(--rule);stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="w1-leaf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--paper-edge)"/>
      <stop offset=".85" style="stop-color:var(--paper)"/>
      <stop offset="1" style="stop-color:var(--paper-edge)"/>
    </linearGradient>
    <linearGradient id="w1-leaf2" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" style="stop-color:var(--paper-edge)"/>
      <stop offset=".85" style="stop-color:var(--paper)"/>
      <stop offset="1" style="stop-color:var(--paper-edge)"/>
    </linearGradient>
    <linearGradient id="w1-ledger" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color:var(--wood)"/>
      <stop offset="1" style="stop-color:var(--wood-deep)"/>
    </linearGradient>
    <linearGradient id="w1-brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--glow)"/>
      <stop offset="1" style="stop-color:var(--brass)"/>
    </linearGradient>
    <radialGradient id="w1-lit" cx="50%" cy="45%" r="60%">
      <stop offset="0" style="stop-color:var(--glow);stop-opacity:.9"/>
      <stop offset="1" style="stop-color:var(--glow);stop-opacity:0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="360" height="560" style="fill:url(#w1-sky)"/>
  <text x="180" y="44" text-anchor="middle" style="fill:var(--ink);font:italic 600 24px var(--display)">where books go</text>
  <path d="M120 58 Q180 66 240 58" style="fill:none;stroke:var(--red);stroke-width:2;stroke-linecap:round"/>

  <!-- the three roads -->
  <path d="M150 452 C120 390 70 330 88 236 L106 236 C96 330 150 392 172 452 Z" style="fill:url(#w1-road)"/>
  <path d="M172 452 C176 380 176 330 178 268 L196 268 C196 330 196 380 192 452 Z" style="fill:url(#w1-road)"/>
  <path d="M194 452 C224 400 262 350 292 270 L300 274 C276 352 236 404 212 452 Z" style="fill:url(#w1-fade)"/>

  <!-- left: the private page, hung like a lit window -->
  <ellipse cx="96" cy="170" rx="78" ry="82" style="fill:url(#w1-lit)"/>
  <path d="M58 104 Q60 100 64 100 L130 100 Q134 100 134 104 L134 226 Q134 230 130 230 L62 230 Q58 230 58 226 Z" style="fill:var(--paper);stroke:var(--wood-deep);stroke-width:2.5"/>
  <path d="M70 120 Q96 116 122 120 M70 134 Q92 131 114 134 M70 148 Q98 145 122 148 M70 162 Q88 160 106 162" style="fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;opacity:.7"/>
  <path d="M84 190 q0 -14 12 -14 q12 0 12 14" style="fill:none;stroke:var(--brass);stroke-width:3.5;stroke-linecap:round"/>
  <rect x="80" y="189" width="32" height="24" rx="4" style="fill:url(#w1-brass);stroke:var(--wood-deep);stroke-width:1.5"/>
  <circle cx="96" cy="199" r="3" style="fill:var(--wood-deep)"/>
  <path d="M96 201 L96 207" style="stroke:var(--wood-deep);stroke-width:2;stroke-linecap:round"/>
  <path d="M96 100 L96 84 M84 84 Q96 76 108 84" style="fill:none;stroke:var(--wood-deep);stroke-width:2;stroke-linecap:round"/>
  <text x="96" y="252" text-anchor="middle" style="fill:var(--ink);font:600 14px var(--display)">private page</text>

  <!-- middle: the ledger, held shut by a brass clasp -->
  <path d="M152 150 Q150 146 154 146 L216 146 Q222 146 222 152 L222 250 Q222 256 216 256 L154 256 Q150 256 152 252 Z" style="fill:url(#w1-ledger)"/>
  <path d="M152 150 L152 252 Q146 250 146 244 L146 156 Q146 150 152 150 Z" style="fill:var(--wood-deep)"/>
  <path d="M162 146 L162 256" style="stroke:var(--brass);stroke-width:1.5;opacity:.6"/>
  <rect x="170" y="168" width="40" height="22" rx="2" style="fill:var(--paper);opacity:.92"/>
  <text x="190" y="184" text-anchor="middle" style="fill:var(--ink);font:600 12px var(--mono);font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0">.md</text>
  <path d="M222 196 L232 196 Q238 196 238 202 L238 214 Q238 220 232 220 L222 220" style="fill:url(#w1-brass);stroke:var(--wood-deep);stroke-width:1.5"/>
  <circle cx="232" cy="208" r="2.5" style="fill:var(--wood-deep)"/>
  <text x="186" y="128" text-anchor="middle" style="fill:var(--ink);font:600 14px var(--display)">committed</text>

  <!-- right: screenshots curling away and fading -->
  <g style="opacity:.75" transform="rotate(14 286 236)">
    <rect x="266" y="218" width="40" height="34" rx="2" style="fill:var(--paper);stroke:var(--muted);stroke-width:1.5"/>
    <rect x="271" y="222" width="30" height="20" style="fill:var(--river);opacity:.55"/>
  </g>
  <g style="opacity:.5" transform="rotate(-18 306 176)">
    <rect x="288" y="160" width="36" height="31" rx="2" style="fill:var(--paper);stroke:var(--muted);stroke-width:1.5"/>
    <rect x="292" y="164" width="28" height="18" style="fill:var(--leaf);opacity:.55"/>
  </g>
  <g style="opacity:.25" transform="rotate(26 300 112)">
    <rect x="284" y="98" width="32" height="27" rx="2" style="fill:var(--paper);stroke:var(--muted);stroke-width:1.5"/>
    <rect x="288" y="102" width="24" height="15" style="fill:var(--river);opacity:.55"/>
  </g>
  <path d="M262 300 q14 -10 6 -24 M282 140 q10 -12 2 -26" style="fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:2 5;stroke-linecap:round;opacity:.7"/>
  <text x="290" y="318" text-anchor="middle" style="fill:var(--muted);font:italic 400 13px var(--body)">not kept</text>

  <!-- the open book -->
  <ellipse cx="182" cy="508" rx="130" ry="16" style="fill:var(--shade)"/>
  <path d="M182 470 C150 452 98 450 60 462 L60 506 C98 494 150 496 182 512 Z" style="fill:url(#w1-leaf);stroke:var(--wood-deep);stroke-width:2"/>
  <path d="M182 470 C214 452 266 450 304 462 L304 506 C266 494 214 496 182 512 Z" style="fill:url(#w1-leaf2);stroke:var(--wood-deep);stroke-width:2"/>
  <path d="M182 470 C160 440 130 432 104 440 C130 446 158 456 182 470 Z" style="fill:var(--paper);stroke:var(--paper-edge);stroke-width:1.5;opacity:.9"/>
  <path d="M76 474 C108 466 148 468 172 480 M76 486 C108 478 148 480 172 492 M192 480 C216 468 256 466 288 474 M192 492 C216 480 256 478 288 486" style="fill:none;stroke:var(--muted);stroke-width:1.5;opacity:.55"/>
  <path d="M182 470 L182 512" style="stroke:var(--red);stroke-width:2.5"/>
</svg>
