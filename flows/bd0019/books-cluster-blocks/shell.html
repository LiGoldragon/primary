<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,600&family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: one page at a time in a grid shell; text pages only, one 68ch column. */
:root{
  --ground:#F3EBDC; --paper:#FBF6EC; --paper-edge:#E9DCC4; --ink:#2D2219; --muted:#6E5E4D; --rule:#D9CAB0;
  --red:#A9321F; --red-soft:#F2DCD2; --glow:#F2C46D; --brass:#B9893A; --river:#5D7E8C; --leaf:#6E8B4E;
  --slate:#4A443D; --slate-deep:#38332D; --slate-ink:#A79C8C; --ink-on-glow:#3A2A16;
  --hill:#B7A77E; --hill-deep:#8E8058; --wood:#8A5A34; --wood-deep:#6A4224; --sign-ink:#FBF2E2;
  --agree:#3F6B3A; --agree-soft:#E2EBD9; --shade:rgba(45,34,25,.14);
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Source Serif 4","Source Serif Pro",Georgia,serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#1C1611; --paper:#261E17; --paper-edge:#35291F; --ink:#EFE5D4; --muted:#AA9A88; --rule:#40342A;
    --red:#E46A52; --red-soft:#3C2119; --glow:#C9953F; --brass:#D2A75A; --river:#7FA3B1; --leaf:#8FAE6B;
    --slate:#2B2723; --slate-deep:#211D1A; --slate-ink:#7F7466; --ink-on-glow:#2A1C0C;
    --hill:#5E5338; --hill-deep:#463D28; --wood:#9A6A42; --wood-deep:#74492A; --sign-ink:#FBF2E2;
    --agree:#9CC48F; --agree-soft:#22301F; --shade:rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#1C1611; --paper:#261E17; --paper-edge:#35291F; --ink:#EFE5D4; --muted:#AA9A88; --rule:#40342A;
  --red:#E46A52; --red-soft:#3C2119; --glow:#C9953F; --brass:#D2A75A; --river:#7FA3B1; --leaf:#8FAE6B;
  --slate:#2B2723; --slate-deep:#211D1A; --slate-ink:#7F7466; --ink-on-glow:#2A1C0C;
  --hill:#5E5338; --hill-deep:#463D28; --wood:#9A6A42; --wood-deep:#74492A; --sign-ink:#FBF2E2;
  --agree:#9CC48F; --agree-soft:#22301F; --shade:rgba(0,0,0,.4);
}
*,*::before,*::after{box-sizing:border-box}
svg text,code,.prov,.eyebrow,.count,.go{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
body{margin:0;background:var(--ground);color:var(--ink);font:400 17px/1.55 var(--body);
  padding-inline:16px;overflow-x:hidden;-webkit-text-size-adjust:100%}
.book{container-type:inline-size;max-width:1000px;margin-inline:auto}
.top{position:sticky;top:0;z-index:2;background:var(--ground);display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 12px;padding-block:10px 8px;border-bottom:1px solid var(--rule)}
.top h1{margin:0;font:600 15px/1.25 var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .count{font:500 12px/1 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.stage{display:block}
.page{scroll-margin-top:64px}
code{font-family:var(--mono);font-size:.84em;background:var(--red-soft);color:var(--ink);padding:.05em .3em;border-radius:2px;overflow-wrap:anywhere}

/* text pages */
.txt .sheet{max-width:68ch;min-width:0;margin-inline:auto;padding-block:20px 36px;display:grid;gap:14px}
.eyebrow{margin:0;font:500 11px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--red)}
h2{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0;font-size:clamp(26px,7.5cqi,38px);line-height:1.1}
.txt p{margin:0}
.src{display:grid;gap:12px}
.src h2.src-h{font-size:clamp(24px,7cqi,34px)}
blockquote.living{margin:0;padding:12px 14px;background:var(--paper);border-radius:2px;display:grid;gap:6px;box-shadow:inset 0 0 0 1px var(--rule)}
blockquote.living p.said{font:italic 400 18px/1.45 var(--body)}
p.prov{font:400 12px/1.45 var(--mono);color:var(--muted);overflow-wrap:anywhere}
aside.note{padding:10px 12px;background:var(--agree-soft);border-radius:2px;display:grid;gap:4px;font-size:15px}
aside.note .tag{font:600 11px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--agree)}
p.mark{padding:10px 12px;border:1px dashed var(--red);border-radius:2px;font-size:15px}
p.mark strong{font:600 11px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--red);margin-right:.4em}
ol.props{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ol.props li{display:grid;grid-template-columns:1.2em minmax(0,1fr);gap:8px;align-items:start;padding:10px 12px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--rule);border-radius:2px}
ol.props .n{font:600 18px/1.4 var(--display);color:var(--red)}

/* position indicator: not controls */
.dots{grid-column:1/-1;display:grid;grid-auto-flow:column;justify-content:center;gap:10px;pointer-events:none;user-select:none}
.dot{width:11px;height:11px;border:1.5px solid var(--muted);border-radius:50%;display:block}
.dot.t{border-radius:1px}
.dot.on{background:var(--red);border-color:var(--red)}
aside.witness{padding:10px 12px;background:var(--paper);border-left:3px solid var(--river);border-radius:2px;display:grid;gap:4px;font-size:15px}
aside.witness .tag{font:600 11px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--river)}
.badge{display:inline-block;margin-left:.5em;padding:.05em .45em;font:600 11px/1.5 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--agree);box-shadow:inset 0 0 0 1px var(--agree);border-radius:2px}
ol.props li.ruled{box-shadow:inset 0 0 0 2px var(--agree);background:var(--agree-soft)}

/* the source's own code: only code scrolls sideways */
.codewrap{max-width:100%;overflow-x:auto;background:var(--paper);box-shadow:inset 0 0 0 1px var(--rule);border-radius:2px}
pre.code{margin:0;padding:10px 12px;font:400 12.5px/1.5 var(--mono);color:var(--ink);white-space:pre;width:max-content;min-width:100%}
pre.code code{background:none;padding:0;font-size:inherit;overflow-wrap:normal}
.src > *{min-width:0}
ul.pts{margin:0;padding-left:1.1em;display:grid;gap:8px}
ul.pts strong,.src p strong{font-weight:600}
blockquote.doc{margin:0;padding:12px 14px;border-left:3px solid var(--brass);background:var(--paper);border-radius:2px}
aside.note.disagree{background:var(--red-soft)}
aside.note.disagree .tag{color:var(--red)}
ol.props li.sup{box-shadow:inset 0 0 0 1px var(--rule);background:var(--paper)}
.badge.sup{color:var(--muted);box-shadow:inset 0 0 0 1px var(--muted)}
</style>

<div class="book">
  <header class="top"><h1>{{TITLE}}</h1><span class="count" id="count">1 / {{N}}</span>
    <div class="dots" aria-hidden="true">{{DOTS}}</div></header>
  <main class="stage" id="stage">
{{PAGES}}
  </main>
</div>
<script>
(function(){
  var pages=[].slice.call(document.querySelectorAll('.page'));
  var dots=[].slice.call(document.querySelectorAll('.dot'));
  var N=pages.length,cur=1,count=document.getElementById('count');
  function mark(n){cur=n;dots.forEach(function(d,i){d.classList.toggle('on',i===n-1);});count.textContent=n+' / '+N;}
  function go(n){n=Math.max(1,Math.min(N,n));pages[n-1].scrollIntoView({behavior:'auto',block:'start'});mark(n);}
  function here(){var best=1,y=window.innerHeight*0.35;pages.forEach(function(p,i){if(p.getBoundingClientRect().top<=y)best=i+1;});mark(best);}
  window.addEventListener('scroll',here,{passive:true});window.addEventListener('resize',here);
  document.addEventListener('keydown',function(e){
    if(e.altKey||e.ctrlKey||e.metaKey)return;
    if(e.key==='ArrowRight'){go(cur+1);e.preventDefault();}
    else if(e.key==='ArrowLeft'){go(cur-1);e.preventDefault();}
  });
  here();
})();
</script>
