<svg viewBox="0 0 360 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="p5t">
  <title id="p5t">A brass balance. In the left pan sits a small bell, the turn event, marked Flow; in the right pan a rolled scroll, the transcript, marked Transcript. The beam waits not quite level, and above the post a question hangs for the living to settle.</title>
  <defs>
    <linearGradient id="p5-brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color:var(--glow)"/>
      <stop offset="1" style="stop-color:var(--brass)"/>
    </linearGradient>
    <linearGradient id="p5-scroll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--paper)"/>
      <stop offset="1" style="stop-color:var(--paper-edge)"/>
    </linearGradient>
    <radialGradient id="p5-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" style="stop-color:var(--glow);stop-opacity:.55"/>
      <stop offset="1" style="stop-color:var(--glow);stop-opacity:0"/>
    </radialGradient>
  </defs>
  <ellipse cx="180" cy="110" rx="80" ry="60" style="fill:url(#p5-halo)"/>
  <text x="180" y="128" text-anchor="middle" style="fill:var(--red);font:italic 600 64px var(--display)">?</text>
  <!-- post and base -->
  <path d="M174 170 L 186 170 L 190 470 L 170 470 Z" style="fill:url(#p5-brass);stroke:var(--wood-deep)"/>
  <path d="M110 490 C 110 470, 140 462, 180 462 C 220 462, 250 470, 250 490 Z" style="fill:var(--wood);stroke:var(--wood-deep)"/>
  <ellipse cx="180" cy="500" rx="120" ry="10" style="fill:var(--shade)"/>
  <circle cx="180" cy="176" r="10" style="fill:var(--brass);stroke:var(--wood-deep);stroke-width:1.5"/>
  <!-- the beam, slightly off level -->
  <path d="M40 186 C 100 174, 260 170, 320 168" style="fill:none;stroke:url(#p5-brass);stroke-width:7;stroke-linecap:round"/>
  <!-- left chains and pan -->
  <g style="fill:none;stroke:var(--brass);stroke-width:1.8">
    <path d="M44 188 L 20 318"/><path d="M44 188 L 92 318"/>
    <path d="M316 170 L 268 300"/><path d="M316 170 L 340 300"/>
  </g>
  <path d="M12 318 C 20 346, 92 346, 100 318 Z" style="fill:url(#p5-brass);stroke:var(--wood-deep)"/>
  <path d="M260 300 C 268 328, 340 328, 348 300 Z" style="fill:url(#p5-brass);stroke:var(--wood-deep)"/>
  <!-- the bell in the left pan -->
  <path d="M40 316 C 38 290, 46 278, 56 278 C 66 278, 74 290, 72 316 L 78 318 L 34 318 Z" style="fill:var(--red);stroke:var(--wood-deep)"/>
  <rect x="52" y="270" width="8" height="9" rx="2" style="fill:var(--wood-deep)"/>
  <text x="56" y="372" text-anchor="middle" style="fill:var(--ink);font:600 16px var(--display)">Flow</text>
  <text x="56" y="392" text-anchor="middle" style="fill:var(--muted);font:400 12px var(--mono);font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0">turn event</text>
  <!-- the scroll in the right pan -->
  <path d="M276 298 L 332 298 L 332 268 L 276 268 Z" style="fill:url(#p5-scroll);stroke:var(--rule)"/>
  <ellipse cx="276" cy="283" rx="7" ry="15" style="fill:var(--wood)"/>
  <ellipse cx="332" cy="283" rx="7" ry="15" style="fill:var(--wood)"/>
  <path d="M286 278 h 36 M286 288 h 26" style="stroke:var(--muted);stroke-width:1.6;stroke-linecap:round"/>
  <text x="304" y="354" text-anchor="middle" style="fill:var(--ink);font:600 16px var(--display)">Transcript</text>
  <text x="304" y="374" text-anchor="middle" style="fill:var(--muted);font:400 12px var(--mono);font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0">content</text>
  <text x="180" y="540" text-anchor="middle" style="fill:var(--muted);font:italic 400 15px var(--body)">or does Flow hold both?</text>
</svg>
