<svg viewBox="0 0 360 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="p2t">
  <title id="p2t">A printer's brass composing stick holds a single set line of type that reads Presentation.{ «title» }. Above it, scraps of dashed paper, the old front matter, drift away and fade. Below, a clean page begins with that one line at its head.</title>
  <defs>
    <linearGradient id="p2-brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--glow)"/>
      <stop offset="1" style="stop-color:var(--brass)"/>
    </linearGradient>
    <linearGradient id="p2-lead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--slate-ink)"/>
      <stop offset="1" style="stop-color:var(--slate)"/>
    </linearGradient>
    <linearGradient id="p2-page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--paper)"/>
      <stop offset="1" style="stop-color:var(--paper-edge)"/>
    </linearGradient>
    <radialGradient id="p2-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" style="stop-color:var(--glow);stop-opacity:.6"/>
      <stop offset="1" style="stop-color:var(--glow);stop-opacity:0"/>
    </radialGradient>
  </defs>
  <!-- old dashed scraps drifting up and away -->
  <g style="opacity:.45">
    <g transform="rotate(-14 90 70)">
      <rect x="44" y="52" width="96" height="40" rx="2" style="fill:var(--paper);stroke:var(--rule)"/>
      <path d="M54 66 h 10 M70 66 h 10 M86 66 h 10" style="stroke:var(--muted);stroke-width:2.5;stroke-linecap:round"/>
      <path d="M54 80 h 64" style="stroke:var(--muted);stroke-width:1.6;stroke-linecap:round"/>
    </g>
    <g transform="rotate(10 270 104)">
      <rect x="226" y="86" width="92" height="36" rx="2" style="fill:var(--paper);stroke:var(--rule)"/>
      <path d="M236 104 h 10 M252 104 h 10 M268 104 h 10" style="stroke:var(--muted);stroke-width:2.5;stroke-linecap:round"/>
    </g>
    <path d="M150 128 c 10 -8 18 -2 26 -10 M196 40 c 8 6 14 2 20 10" style="fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:2 5;stroke-linecap:round"/>
  </g>
  <!-- the stick with its one line -->
  <ellipse cx="180" cy="210" rx="190" ry="90" style="fill:url(#p2-halo)"/>
  <path d="M28 222 L 332 222 L 332 252 C 332 258, 328 262, 322 262 L 38 262 C 32 262, 28 258, 28 252 Z" style="fill:url(#p2-brass);stroke:var(--wood-deep);stroke-width:1.5"/>
  <path d="M28 222 L 28 178 L 42 178 L 42 222 Z" style="fill:url(#p2-brass);stroke:var(--wood-deep);stroke-width:1.5"/>
  <path d="M300 222 L 300 182 L 316 182 L 316 222 Z" style="fill:var(--wood);stroke:var(--wood-deep)"/>
  <rect x="44" y="184" width="254" height="38" rx="2" style="fill:url(#p2-lead)"/>
  <g style="stroke:var(--slate-deep);stroke-width:1;opacity:.6">
    <path d="M60 184 v 38 M76 184 v 38 M92 184 v 38 M108 184 v 38 M124 184 v 38 M140 184 v 38 M156 184 v 38 M172 184 v 38 M188 184 v 38 M204 184 v 38 M220 184 v 38 M236 184 v 38 M252 184 v 38 M268 184 v 38 M284 184 v 38"/>
  </g>
  <text x="171" y="208" text-anchor="middle" style="fill:var(--sign-ink);font:600 13.5px var(--mono);font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0">Presentation.{ «title» }</text>
  <text x="180" y="160" text-anchor="middle" style="fill:var(--ink);font:italic 600 18px var(--display)">one datom line</text>
  <!-- the inked page below: the line stands at its head -->
  <path d="M180 270 C 180 290, 180 300, 180 316" style="fill:none;stroke:var(--red);stroke-width:5;stroke-linecap:round"/>
  <path d="M168 306 L 180 324 L 192 306" style="fill:none;stroke:var(--red);stroke-width:5;stroke-linecap:round;stroke-linejoin:round"/>
  <ellipse cx="184" cy="522" rx="130" ry="12" style="fill:var(--shade)"/>
  <path d="M66 338 L 296 334 C 302 334, 306 338, 306 344 L 304 506 C 304 512, 300 516, 294 516 L 72 520 C 66 520, 62 516, 62 510 L 60 344 C 60 340, 62 338, 66 338 Z" style="fill:url(#p2-page);stroke:var(--rule)"/>
  <rect x="80" y="356" width="190" height="20" rx="2" style="fill:var(--red-soft)"/>
  <text x="86" y="371" style="fill:var(--red);font:500 12px var(--mono);font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0">Presentation.{ «…» }</text>
  <path d="M80 404 c 0 0 0 0 0 0" style="stroke:none"/>
  <text x="80" y="408" style="fill:var(--ink);font:600 17px var(--display)">The anatomy</text>
  <g style="fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;opacity:.55">
    <path d="M80 432 c 10 -6 14 6 24 0 s 14 -8 24 0 s 12 6 24 -2 s 14 -6 24 0 s 10 4 20 0"/>
    <path d="M80 454 c 10 -6 14 6 24 0 s 14 -8 24 0 s 12 6 24 -2 s 14 -6 24 0"/>
    <path d="M80 476 c 10 -6 14 6 24 0 s 14 -8 24 0 s 12 6 20 -2"/>
  </g>
</svg>
