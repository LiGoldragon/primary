<svg viewBox="0 0 360 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="k5">
  <title id="k5">A lamp-lit workbench. On it, a brass hook only half shaped, and two paper slips held under a stone, still unanswered.</title>
  <defs>
    <radialGradient id="k5-lamp" cx="50%" cy="50%" r="50%">
      <stop offset="0" style="stop-color:var(--glow);stop-opacity:.75"/>
      <stop offset=".6" style="stop-color:var(--glow);stop-opacity:.2"/>
      <stop offset="1" style="stop-color:var(--glow);stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="k5-wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--wood)"/>
      <stop offset="1" style="stop-color:var(--wood-deep)"/>
    </linearGradient>
    <linearGradient id="k5-brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color:var(--glow)"/>
      <stop offset=".5" style="stop-color:var(--brass)"/>
      <stop offset="1" style="stop-color:var(--wood)"/>
    </linearGradient>
    <linearGradient id="k5-slip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--paper)"/>
      <stop offset="1" style="stop-color:var(--paper-edge)"/>
    </linearGradient>
    <radialGradient id="k5-stone" cx="40%" cy="35%" r="70%">
      <stop offset="0" style="stop-color:var(--slate-ink)"/>
      <stop offset="1" style="stop-color:var(--slate)"/>
    </radialGradient>
  </defs>
  <circle cx="210" cy="150" r="150" style="fill:url(#k5-lamp)"/>
  <!-- hanging lamp -->
  <path d="M224 0 L 224 70" style="stroke:var(--ink);stroke-width:1.5;opacity:.6"/>
  <path d="M196 96 C 196 76, 252 76, 252 96 L 262 112 L 186 112 Z" style="fill:url(#k5-brass)"/>
  <ellipse cx="224" cy="116" rx="22" ry="7" style="fill:var(--glow)"/>
  <!-- bench top -->
  <path d="M0 340 L 360 318 L 360 382 L 0 404 Z" style="fill:url(#k5-wood)"/>
  <path d="M0 404 L 360 382 L 360 400 L 0 422 Z" style="fill:var(--wood-deep)"/>
  <path d="M40 420 L 40 560 M 320 398 L 320 560" style="stroke:var(--wood-deep);stroke-width:16"/>
  <g style="fill:none;stroke:var(--wood-deep);stroke-width:1.2;opacity:.6">
    <path d="M20 360 C 120 350, 220 344, 340 334"/><path d="M10 384 C 130 372, 240 366, 350 356"/>
  </g>
  <!-- the half-shaped hook: a bar bending into a hook, its tip still straight -->
  <path d="M60 300 C 100 296, 140 292, 168 290 C 190 288, 200 268, 190 252 C 182 240, 170 240, 164 250" style="fill:none;stroke:url(#k5-brass);stroke-width:9;stroke-linecap:round"/>
  <path d="M60 300 C 100 296, 140 292, 168 290" style="fill:none;stroke:var(--glow);stroke-width:2;stroke-linecap:round;opacity:.8"/>
  <g style="fill:var(--glow)"><circle cx="168" cy="244" r="2.5"/><circle cx="178" cy="234" r="1.8"/><circle cx="160" cy="236" r="1.5"/></g>
  <!-- two slips under a stone -->
  <g transform="rotate(-8 250 280)">
    <rect x="206" y="214" width="110" height="74" rx="3" style="fill:url(#k5-slip);stroke:var(--rule)"/>
    <text x="220" y="240" style="fill:var(--red);font:600 18px var(--display)">1</text>
    <path d="M240 236 c 6 -4 9 4 14 0 s 8 -5 13 0 s 7 3 12 0 s 8 -4 12 0" style="fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;opacity:.7"/>
    <path d="M220 262 c 6 -4 9 4 14 0 s 8 -5 13 0 s 7 3 12 0" style="fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;opacity:.7"/>
  </g>
  <g transform="rotate(6 270 300)">
    <rect x="222" y="262" width="110" height="64" rx="3" style="fill:url(#k5-slip);stroke:var(--rule)"/>
    <text x="236" y="290" style="fill:var(--red);font:600 18px var(--display)">2</text>
    <path d="M256 286 c 6 -4 9 4 14 0 s 8 -5 13 0 s 7 3 12 0 s 8 -4 12 0" style="fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;opacity:.7"/>
    <path d="M236 308 c 6 -4 9 4 14 0 s 8 -5 13 0" style="fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;opacity:.7"/>
  </g>
  <path d="M268 316 C 262 296, 284 284, 304 290 C 322 296, 326 316, 312 324 C 298 332, 274 330, 268 316 Z" style="fill:url(#k5-stone)"/>
  <text x="24" y="200" style="fill:var(--ink);font:italic 600 16px var(--display)">still open</text>
</svg>
