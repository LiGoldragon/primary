<svg viewBox="0 0 360 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t3">
  <title id="t3">A river of transcript lines runs down the page. A hook lifts the one marked block out of it, and a fat red arrow carries it down to an open book.</title>
  <defs>
    <linearGradient id="h-river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--river);stop-opacity:.15"/>
      <stop offset=".5" style="stop-color:var(--river);stop-opacity:.4"/>
      <stop offset="1" style="stop-color:var(--river);stop-opacity:.1"/>
    </linearGradient>
    <radialGradient id="h-parcel" cx="50%" cy="40%" r="70%">
      <stop offset="0" style="stop-color:var(--glow)"/>
      <stop offset="1" style="stop-color:var(--glow);stop-opacity:.55"/>
    </radialGradient>
    <linearGradient id="h-page" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--paper-edge)"/>
      <stop offset=".5" style="stop-color:var(--paper)"/>
      <stop offset="1" style="stop-color:var(--paper-edge)"/>
    </linearGradient>
    <filter id="h-rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="4"/>
    </filter>
  </defs>
  <!-- river of transcript, winding down the left -->
  <path d="M60 0 C 20 80, 120 140, 70 220 C 30 290, 110 330, 80 400 C 60 450, 30 500, 50 560 L 130 560 C 110 500, 140 450, 150 400 C 180 320, 100 280, 140 220 C 190 140, 90 80, 130 0 Z" style="fill:url(#h-river)"/>
  <g style="fill:var(--muted);opacity:.5">
    <rect x="72" y="30" width="34" height="5" rx="2.5" transform="rotate(20 89 32)"/>
    <rect x="62" y="96" width="40" height="5" rx="2.5" transform="rotate(-15 82 98)"/>
    <rect x="88" y="148" width="30" height="5" rx="2.5" transform="rotate(-30 103 150)"/>
    <rect x="76" y="292" width="38" height="5" rx="2.5" transform="rotate(25 95 294)"/>
    <rect x="90" y="350" width="30" height="5" rx="2.5" transform="rotate(-10 105 352)"/>
    <rect x="70" y="440" width="40" height="5" rx="2.5" transform="rotate(15 90 442)"/>
    <rect x="66" y="510" width="34" height="5" rx="2.5" transform="rotate(-20 83 512)"/>
  </g>
  <text x="16" y="250" transform="rotate(-90 16 250)" text-anchor="middle" style="fill:var(--muted);font:500 12px var(--mono);letter-spacing:.1em">TRANSCRIPT</text>
  <!-- fishing line and hook -->
  <path d="M250 0 C 250 40, 252 80, 248 110" style="fill:none;stroke:var(--ink);stroke-width:1.5;opacity:.7"/>
  <path d="M248 110 L 248 150 C 248 176, 212 178, 210 156 L 214 148" style="fill:none;stroke:var(--brass);stroke-width:4;stroke-linecap:round;stroke-linejoin:round"/>
  <path d="M214 148 L 206 150 L 212 142" style="fill:var(--brass)"/>
  <text x="262" y="96" style="fill:var(--ink);font:600 14px var(--display)">hook</text>
  <!-- the caught parcel: marked block -->
  <g transform="rotate(-6 200 200)">
    <rect x="150" y="164" width="120" height="78" rx="4" style="fill:url(#h-parcel);stroke:var(--brass);stroke-width:1.2"/>
    <path d="M150 170 L 270 170" style="stroke:var(--red);stroke-width:5;stroke-linecap:round"/>
    <path d="M150 236 L 270 236" style="stroke:var(--red);stroke-width:5;stroke-linecap:round"/>
    <g style="fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;opacity:.8">
      <path d="M162 190 c 6 -5 10 5 16 0 s 10 -6 16 0 s 8 5 16 -1 s 10 -5 16 0 s 10 4 16 -1 s 8 -3 12 0"/>
      <path d="M162 206 c 6 -5 10 5 16 0 s 10 -6 16 0 s 8 5 16 -1 s 10 -5 16 0 s 10 4 16 -1"/>
      <path d="M162 222 c 6 -5 10 5 16 0 s 10 -6 16 0 s 8 5 14 -1"/>
    </g>
  </g>
  <!-- splash drops from where it left the river -->
  <g style="fill:var(--river);opacity:.55">
    <circle cx="146" cy="250" r="3"/><circle cx="136" cy="262" r="2"/><circle cx="156" cy="268" r="2.5"/>
  </g>
  <!-- fat red hand-coloured arrow -->
  <g filter="url(#h-rough)">
    <path d="M232 256 C 290 300, 300 350, 250 396" style="fill:none;stroke:var(--red);stroke-width:18;stroke-linecap:round"/>
    <path d="M220 388 L 268 372 L 256 420 Z" style="fill:var(--red);stroke:var(--red);stroke-width:6;stroke-linejoin:round"/>
  </g>
  <!-- open book -->
  <g>
    <path d="M150 440 C 186 428, 214 432, 240 446 L 240 536 C 214 522, 186 518, 150 530 Z" style="fill:url(#h-page);stroke:var(--ink);stroke-width:1.2;stroke-opacity:.5"/>
    <path d="M240 446 C 266 432, 300 428, 334 440 L 334 530 C 300 518, 266 522, 240 536 Z" style="fill:url(#h-page);stroke:var(--ink);stroke-width:1.2;stroke-opacity:.5"/>
    <path d="M240 446 L 240 536" style="stroke:var(--ink);stroke-width:1.4;opacity:.5"/>
    <g style="fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;opacity:.6">
      <path d="M164 462 c 12 -4 30 -6 62 0"/><path d="M164 478 c 12 -4 30 -6 62 0"/><path d="M164 494 c 12 -4 30 -6 50 0"/>
      <path d="M254 458 c 20 -6 40 -6 66 0"/><path d="M254 474 c 20 -6 40 -6 66 0"/>
    </g>
    <circle cx="288" cy="500" r="12" style="fill:var(--glow);opacity:.8"/>
  </g>
  <text x="246" y="556" text-anchor="middle" style="fill:var(--ink);font:600 14px var(--display)">book</text>
</svg>
