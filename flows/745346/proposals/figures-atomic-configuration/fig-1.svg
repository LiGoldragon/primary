<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 340" font-family="sans-serif" font-size="16" fill="#000">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <!-- boxes -->
  <rect x="5" y="10" width="190" height="90" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="100" y="38" text-anchor="middle">Configure.Amend:</text>
  <text x="100" y="58" text-anchor="middle">an address and</text>
  <text x="100" y="78" text-anchor="middle">one change</text>

  <rect x="225" y="10" width="190" height="90" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="320" y="38" text-anchor="middle">Configure.Permaflow:</text>
  <text x="320" y="58" text-anchor="middle">one definition,</text>
  <text x="320" y="78" text-anchor="middle">whole</text>

  <rect x="5" y="150" width="190" height="70" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="100" y="178" text-anchor="middle">one value of</text>
  <text x="100" y="198" text-anchor="middle">one permaflow</text>

  <rect x="225" y="150" width="190" height="70" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="320" y="191" text-anchor="middle">one permaflow</text>

  <rect x="5" y="270" width="410" height="60" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="210" y="306" text-anchor="middle">that permaflow's next flow</text>

  <!-- verbed arrows -->
  <line x1="100" y1="100" x2="100" y2="150" stroke="#000" stroke-width="2" marker-end="url(#ah)"/>
  <text x="110" y="130">changes</text>

  <line x1="320" y1="100" x2="320" y2="150" stroke="#000" stroke-width="2" marker-end="url(#ah)"/>
  <text x="330" y="122">adds or</text>
  <text x="330" y="140">replaces</text>

  <line x1="100" y1="220" x2="100" y2="270" stroke="#000" stroke-width="2" marker-end="url(#ah)"/>
  <text x="110" y="238">takes effect</text>
  <text x="110" y="258">at</text>

  <line x1="320" y1="220" x2="320" y2="270" stroke="#000" stroke-width="2" marker-end="url(#ah)"/>
  <text x="330" y="238">takes effect</text>
  <text x="330" y="258">at</text>
</svg>
