<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 560" width="620" height="560" font-family="sans-serif" font-size="20">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
    </marker>
  </defs>
  <!-- arrows first, labels sit on top with white fill -->
  <line x1="100" y1="140" x2="100" y2="240" stroke="#000" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="310" y1="140" x2="310" y2="240" stroke="#000" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="520" y1="140" x2="520" y2="240" stroke="#000" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="100" y1="370" x2="100" y2="470" stroke="#000" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="310" y1="370" x2="310" y2="470" stroke="#000" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="520" y1="370" x2="520" y2="470" stroke="#000" stroke-width="2" marker-end="url(#ah)"/>

  <!-- row 1: sources -->
  <rect x="10" y="20" width="180" height="120" rx="6" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="100" y="62" text-anchor="middle">the Nexus's</text>
  <text x="100" y="86" text-anchor="middle">Ethos: Signal</text>
  <text x="100" y="110" text-anchor="middle">and Emission</text>

  <rect x="220" y="20" width="180" height="120" rx="6" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="310" y="74" text-anchor="middle">the translator</text>
  <text x="310" y="98" text-anchor="middle">library</text>

  <rect x="430" y="20" width="180" height="120" rx="6" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="520" y="87" text-anchor="middle">the implementer</text>

  <!-- row 2: bodies and parts -->
  <rect x="10" y="240" width="180" height="130" rx="6" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="100" y="275" text-anchor="middle">its types, and</text>
  <text x="100" y="299" text-anchor="middle">the dispatch of</text>
  <text x="100" y="323" text-anchor="middle">each emission</text>
  <text x="100" y="347" text-anchor="middle">to its body</text>

  <rect x="220" y="240" width="180" height="130" rx="6" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="310" y="275" text-anchor="middle">the sockets,</text>
  <text x="310" y="299" text-anchor="middle">the text,</text>
  <text x="310" y="323" text-anchor="middle">the caller,</text>
  <text x="310" y="347" text-anchor="middle">the serving</text>

  <rect x="430" y="240" width="180" height="130" rx="6" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="520" y="275" text-anchor="middle">one body for</text>
  <text x="520" y="299" text-anchor="middle">each emission:</text>
  <text x="520" y="323" text-anchor="middle">the words of</text>
  <text x="520" y="347" text-anchor="middle">the call</text>

  <!-- edge labels, row 1 to row 2 -->
  <rect x="38" y="175" width="124" height="30" fill="#fff"/>
  <text x="100" y="197" text-anchor="middle">generates</text>
  <rect x="192" y="175" width="236" height="30" fill="#fff"/>
  <text x="310" y="197" text-anchor="middle">gives, written once</text>
  <rect x="435" y="175" width="170" height="30" fill="#fff"/>
  <text x="520" y="197" text-anchor="middle">writes by hand</text>

  <!-- row 3: the translator -->
  <rect x="10" y="470" width="600" height="70" rx="6" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="310" y="512" text-anchor="middle">the Nexus's translator</text>

  <!-- edge labels, row 2 to row 3 -->
  <rect x="30" y="405" width="140" height="30" fill="#fff"/>
  <text x="100" y="427" text-anchor="middle">together are</text>
  <rect x="240" y="405" width="140" height="30" fill="#fff"/>
  <text x="310" y="427" text-anchor="middle">together are</text>
  <rect x="450" y="405" width="140" height="30" fill="#fff"/>
  <text x="520" y="427" text-anchor="middle">together are</text>
</svg>
