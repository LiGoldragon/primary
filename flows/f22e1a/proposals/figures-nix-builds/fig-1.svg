<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 616" width="420" height="616" font-family="sans-serif">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="420" height="616" fill="#ffffff"/>

  <!-- arrows -->
  <path d="M210,90 V150" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#head)"/>
  <path d="M210,196 V256" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#head)"/>
  <path d="M210,340 V380 H105 V420" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#head)"/>
  <path d="M210,340 V380 H315 V420" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#head)"/>
  <path d="M315,466 V510" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#head)"/>

  <!-- verbs -->
  <text x="222" y="124" font-size="14" fill="#333333">input of</text>
  <text x="222" y="230" font-size="14" fill="#333333">one derivation per crate</text>
  <text x="198" y="372" font-size="14" fill="#333333" text-anchor="end">built once, served by</text>
  <text x="222" y="372" font-size="14" fill="#333333">its tests compiled with it</text>
  <text x="327" y="492" font-size="14" fill="#333333">run by</text>

  <!-- things -->
  <rect x="20" y="20" width="380" height="70" rx="8" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
  <text x="210" y="47" font-size="16" fill="#111111" text-anchor="middle">build base: nixpkgs, toolchain,</text>
  <text x="210" y="69" font-size="16" fill="#111111" text-anchor="middle">overrides, one pin</text>

  <rect x="20" y="150" width="380" height="46" rx="8" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
  <text x="210" y="179" font-size="16" fill="#111111" text-anchor="middle">every active repository</text>

  <rect x="20" y="256" width="380" height="84" rx="8" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
  <text x="210" y="292" font-size="16" fill="#111111" text-anchor="middle">a crate at one version and feature set:</text>
  <text x="210" y="314" font-size="16" fill="#111111" text-anchor="middle">one hash everywhere</text>

  <rect x="20" y="420" width="170" height="60" rx="8" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
  <text x="105" y="444" font-size="16" fill="#111111" text-anchor="middle">the remote</text>
  <text x="105" y="466" font-size="16" fill="#111111" text-anchor="middle">builder's store</text>

  <rect x="230" y="420" width="170" height="46" rx="8" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
  <text x="315" y="448" font-size="16" fill="#111111" text-anchor="middle">test binaries</text>

  <rect x="230" y="510" width="170" height="86" rx="8" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
  <text x="315" y="538" font-size="15" fill="#111111" text-anchor="middle">the crate's check:</text>
  <text x="315" y="558" font-size="15" fill="#111111" text-anchor="middle">runs, compiles</text>
  <text x="315" y="578" font-size="15" fill="#111111" text-anchor="middle">nothing</text>
</svg>
