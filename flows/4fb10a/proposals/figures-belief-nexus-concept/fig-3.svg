<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 600" width="420" height="600" font-family="sans-serif" font-size="18">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>

  <!-- arrows -->
  <g stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="210" y1="92" x2="210" y2="140"/>
    <line x1="170" y1="212" x2="105" y2="268"/>
    <line x1="250" y1="212" x2="315" y2="268"/>
    <line x1="105" y1="340" x2="170" y2="388"/>
    <line x1="315" y1="340" x2="250" y2="388"/>
    <line x1="210" y1="460" x2="210" y2="508"/>
  </g>

  <!-- boxes -->
  <g fill="#fff" stroke="#000" stroke-width="2">
    <rect x="80" y="20" width="260" height="72" rx="6"/>
    <rect x="80" y="140" width="260" height="72" rx="6"/>
    <rect x="10" y="268" width="190" height="72" rx="6"/>
    <rect x="220" y="268" width="190" height="72" rx="6"/>
    <rect x="80" y="388" width="260" height="72" rx="6"/>
    <rect x="80" y="508" width="260" height="72" rx="6"/>
  </g>

  <!-- labels -->
  <g fill="#000" text-anchor="middle">
    <text x="210" y="50">Input:</text>
    <text x="210" y="74">Prompt</text>

    <text x="210" y="170">Attempt:</text>
    <text x="210" y="194">Prompting</text>

    <text x="105" y="298">Memory:</text>
    <text x="105" y="322">the pane is known</text>

    <text x="315" y="298">Emission:</text>
    <text x="315" y="322">Herdr call</text>

    <text x="210" y="418">Outcome:</text>
    <text x="210" y="442">Prompted or Failed</text>

    <text x="210" y="538">Output:</text>
    <text x="210" y="562">Prompted.Outcome</text>
  </g>
</svg>
