<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 580" width="420" height="580" font-family="sans-serif" font-size="19" fill="#000">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <g fill="#fff" stroke="#000" stroke-width="2">
    <rect x="60" y="20" width="300" height="70" rx="6"/>
    <rect x="60" y="150" width="300" height="70" rx="6"/>
    <rect x="10" y="300" width="200" height="100" rx="6"/>
    <rect x="230" y="300" width="180" height="100" rx="6"/>
    <rect x="230" y="490" width="180" height="60" rx="6"/>
  </g>
  <g stroke="#000" stroke-width="2" fill="none">
    <line x1="210" y1="90" x2="210" y2="149" marker-end="url(#arrow)"/>
    <line x1="110" y1="220" x2="110" y2="298" marker-end="url(#arrow)"/>
    <line x1="170" y1="300" x2="170" y2="221" marker-end="url(#arrow)"/>
