<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 620" width="420" height="620" font-family="sans-serif" font-size="14">
  <defs>
    <marker id="head" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#000"/>
    </marker>
  </defs>

  <!-- boxes -->
  <g fill="#fff" stroke="#000" stroke-width="1.5">
    <rect x="10" y="20" width="190" height="50"/>
    <rect x="10" y="260" width="100" height="210"/>
    <rect x="310" y="260" width="100" height="210"/>
    <rect x="10" y="560" width="190" height="50"/>
  </g>
  <g fill="#000" font-size="15" text-anchor="middle">
    <text x="105" y="50">CLI: one datom</text>
    <text x="60" y="370">translator</text>
    <text x="360" y="370">Nexus</text>
    <text x="105" y="590">world</text>
  </g>

  <!-- arrows -->
  <g fill="none" stroke="#000" stroke-width="1.5">
    <line x1="30" y1="70" x2="30" y2="260" marker-end="url(#head)"/>
    <line x1="100" y1="260" x2="100" y2="70" marker-end="url(#head)"/>
    <line x1="110" y1="300" x2="310" y2="300" marker-end="url(#head)"/>
    <line x1="310" y1="352" x2="110" y2="352" marker-end="url(#head)"/>
    <line x1="310" y1="404" x2="110" y2="404" marker-end="url(#head)"/>
    <line x1="110" y1="456" x2="310" y2="456" marker-end="url(#head)"/>
    <line x1="30" y1="470" x2="30" y2="560" marker-end="url(#head)"/>
    <line x1="100" y1="560" x2="100" y2="470" marker-end="url(#head)"/>
  </g>

  <!-- arrow labels -->
  <g fill="#000" font-size="14">
    <text x="36" y="165">text</text>
    <text x="106" y="165">text</text>
    <text x="210" y="276" text-anchor="middle">Call.{ Caller Input },</text>
    <text x="210" y="292" text-anchor="middle">signal</text>
    <text x="210" y="344" text-anchor="middle">Output, signal</text>
    <text x="210" y="396" text-anchor="middle">Emission, signal</text>
    <text x="210" y="448" text-anchor="middle">Outcome, signal</text>
    <text x="36" y="520">the call</text>
    <text x="106" y="520">exit status</text>
  </g>
</svg>
