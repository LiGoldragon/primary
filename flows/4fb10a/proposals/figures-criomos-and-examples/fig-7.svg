<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
  </defs>
  <rect x="10" y="20" width="180" height="90" fill="white" stroke="black" stroke-width="2"/>
  <text x="100" y="52" font-size="16" text-anchor="middle" fill="black">default modules:</text>
  <text x="100" y="74" font-size="16" text-anchor="middle" fill="black">the Nexus's one</text>
  <text x="100" y="96" font-size="16" text-anchor="middle" fill="black">configured list</text>
  <rect x="210" y="20" width="180" height="90" fill="white" stroke="black" stroke-width="2"/>
  <text x="300" y="52" font-size="16" text-anchor="middle" fill="black">the member's</text>
  <text x="300" y="74" font-size="16" text-anchor="middle" fill="black">own Beliefs</text>
  <rect x="60" y="230" width="280" height="60" fill="white" stroke="black" stroke-width="2"/>
  <text x="200" y="266" font-size="16" text-anchor="middle" fill="black">the flow's workspace</text>
  <line x1="100" y1="110" x2="100" y2="228" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="110" y="165" font-size="14" text-anchor="start" fill="black">composed first</text>
  <line x1="300" y1="110" x2="300" y2="228" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="290" y="205" font-size="14" text-anchor="end" fill="black">composed after</text>
</svg>
