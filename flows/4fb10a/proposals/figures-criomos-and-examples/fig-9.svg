<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" width="640" height="580" font-family="sans-serif" font-size="15">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black"/>
    </marker>
  </defs>
  <g fill="white" stroke="black" stroke-width="2">
    <rect x="200" y="20" width="200" height="50"/>
    <rect x="200" y="170" width="200" height="50"/>
    <rect x="200" y="320" width="200" height="50"/>
    <rect x="200" y="420" width="200" height="50"/>
    <rect x="200" y="500" width="200" height="50"/>
  </g>
  <g fill="black" text-anchor="middle">
    <text x="300" y="50">the Flow Nexus</text>
    <text x="300" y="200">any flow</text>
    <text x="300" y="350">permanent flow, hot</text>
    <text x="300" y="440">successor,</text>
    <text x="300" y="458">from its modules</text>
    <text x="300" y="530">harness subagent</text>
  </g>
  <g stroke="black" stroke-width="2" fill="none">
    <line x1="300" y1="70" x2="300" y2="170" marker-end="url(#arrow)"/>
    <line x1="300" y1="220" x2="300" y2="320" marker-end="url(#arrow)"/>
    <line x1="300" y1="370" x2="300" y2="420" marker-end="url(#arrow)"/>
    <polyline points="200,345 180,345 180,195 200,195" marker-end="url(#arrow)"/>
    <polyline points="400,195 440,195 440,525 400,525" stroke-dasharray="6,5" marker-end="url(#arrow)"/>
  </g>
  <g fill="black">
    <text x="312" y="105">roster in the first prompt,</text>
    <text x="312" y="122">each change pushed</text>
    <text x="312" y="250">Send</text>
    <text x="170" y="258" text-anchor="end">answers as</text>
    <text x="170" y="276" text-anchor="end">a message</text>
    <text x="288" y="395" text-anchor="end">past threshold,</text>
    <text x="288" y="412" text-anchor="end">replaced by</text>
    <text x="452" y="345">only if no running</text>
    <text x="452" y="362">flow holds the work</text>
  </g>
</svg>
