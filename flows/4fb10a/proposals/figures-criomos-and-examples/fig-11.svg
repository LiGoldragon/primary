<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 380" width="490" height="380" font-family="sans-serif" font-size="16">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black"/>
    </marker>
  </defs>
  <g fill="white" stroke="black" stroke-width="2">
    <rect x="10" y="20" width="190" height="64"/>
    <rect x="270" y="20" width="200" height="64"/>
    <rect x="10" y="170" width="460" height="60"/>
    <rect x="10" y="300" width="460" height="60"/>
  </g>
  <g fill="black" text-anchor="middle">
    <text x="105" y="46">Memory:</text>
    <text x="105" y="70">each flow's state</text>
    <text x="370" y="58">Broadcast.Request</text>
    <text x="240" y="206">the hot flows</text>
    <text x="240" y="336">Broadcast.Vector of FlowId</text>
  </g>
  <g stroke="black" stroke-width="2" fill="none">
    <line x1="105" y1="84" x2="105" y2="168" marker-end="url(#arrow)"/>
    <line x1="370" y1="84" x2="370" y2="168" marker-end="url(#arrow)"/>
    <line x1="240" y1="230" x2="240" y2="298" marker-end="url(#arrow)"/>
  </g>
  <g fill="black">
    <text x="115" y="132">Running or Idle</text>
    <text x="380" y="122">one prompt</text>
    <text x="380" y="142">into each</text>
    <text x="250" y="268">who received it</text>
  </g>
</svg>
