<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" font-family="sans-serif" font-size="16">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
  </defs>
  <rect x="10" y="20" width="180" height="70" fill="white" stroke="black" stroke-width="2"/>
  <text x="100" y="48" text-anchor="middle">a request delivered</text>
  <text x="100" y="70" text-anchor="middle">to the flow</text>

  <rect x="210" y="20" width="180" height="70" fill="white" stroke="black" stroke-width="2"/>
  <text x="300" y="60" text-anchor="middle">the flow refreshes</text>

  <rect x="210" y="190" width="180" height="110" fill="white" stroke="black" stroke-width="2"/>
  <text x="300" y="225" text-anchor="middle">the successor's first</text>
  <text x="300" y="249" text-anchor="middle">prompt: every open</text>
  <text x="300" y="273" text-anchor="middle">request, same ids</text>

  <rect x="10" y="400" width="200" height="70" fill="white" stroke="black" stroke-width="2"/>
  <text x="110" y="440" text-anchor="middle">its Result or Done</text>

  <line x1="60" y1="90" x2="60" y2="398" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="70" y="250" text-anchor="start">is open until</text>

  <line x1="300" y1="90" x2="300" y2="188" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="290" y="130" text-anchor="end">the Nexus carries,</text>
  <text x="290" y="152" text-anchor="end">with the handover</text>

  <line x1="240" y1="300" x2="180" y2="398" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="355" text-anchor="start">answers with</text>
</svg>
