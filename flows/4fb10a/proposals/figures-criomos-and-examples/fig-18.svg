<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" font-family="sans-serif" font-size="18" fill="#000" stroke="#000">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000" stroke="none"/>
    </marker>
  </defs>
  <!-- d -->
  <rect x="40" y="20" width="560" height="90" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="320" y="55" text-anchor="middle" stroke="none">definitions: one datom file per complex,</text>
  <text x="320" y="85" text-anchor="middle" stroke="none">metaflow and harness</text>
  <!-- d -> f -->
  <line x1="320" y1="110" x2="320" y2="198" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="332" y="160" stroke="none">Define, through the CLI</text>
  <!-- f -->
  <rect x="250" y="200" width="140" height="56" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="320" y="234" text-anchor="middle" stroke="none">Flow Nexus</text>
  <!-- l -> f -->
  <rect x="40" y="200" width="140" height="70" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="110" y="232" text-anchor="middle" stroke="none">the living,</text>
  <text x="110" y="256" text-anchor="middle" stroke="none">at a CLI</text>
  <line x1="180" y1="228" x2="248" y2="228" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="215" y="220" text-anchor="middle" stroke="none">Say</text>
  <!-- f -> b -->
  <line x1="270" y1="256" x2="150" y2="338" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="188" y="300" text-anchor="end" stroke="none">Furnish, signal</text>
  <!-- b -->
  <rect x="40" y="340" width="220" height="56" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="150" y="374" text-anchor="middle" stroke="none">Belief Nexus</text>
  <!-- f -> h -->
  <line x1="370" y1="256" x2="490" y2="338" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="484" y="300" stroke="none">Create, Start,</text>
  <text x="484" y="324" stroke="none">Prompt, signal</text>
  <!-- h -->
  <rect x="380" y="340" width="220" height="56" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="490" y="374" text-anchor="middle" stroke="none">herdr Nexus</text>
  <!-- b -> w -->
  <line x1="150" y1="396" x2="150" y2="498" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="162" y="436" stroke="none">writes the</text>
  <text x="162" y="458" stroke="none">bundle and</text>
  <text x="162" y="480" stroke="none">the skills</text>
  <!-- w -->
  <rect x="40" y="500" width="220" height="56" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="150" y="534" text-anchor="middle" stroke="none">workspace</text>
  <!-- h -> p -->
  <line x1="490" y1="396" x2="490" y2="498" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="502" y="452" stroke="none">runs herdr</text>
  <!-- p -->
  <rect x="370" y="500" width="240" height="70" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="490" y="528" text-anchor="middle" stroke="none">pane:</text>
  <text x="490" y="552" text-anchor="middle" stroke="none">the harness, the flow</text>
  <!-- p -> f -->
  <polyline points="370,535 320,535 320,258" fill="none" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="332" y="410" stroke="none">Report, through</text>
  <text x="332" y="432" stroke="none">the CLI, from</text>
  <text x="332" y="454" stroke="none">a hook</text>
</svg>
