<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 490" width="600" height="490" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="560" height="110" fill="white" stroke="black" stroke-width="2"/>
  <text x="40" y="60" font-size="20" fill="black">complex: a named set of metaflows,</text>
  <text x="40" y="85" font-size="20" fill="black">the relationships between them,</text>
  <text x="40" y="110" font-size="20" fill="black">a speaker</text>

  <line x1="300" y1="130" x2="300" y2="190" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="316" y="165" font-size="18" fill="black">is made of</text>

  <rect x="20" y="190" width="560" height="110" fill="white" stroke="black" stroke-width="2"/>
  <text x="40" y="230" font-size="20" fill="black">metaflow: several flows defined together,</text>
  <text x="40" y="255" font-size="20" fill="black">with their routes and a speaker</text>

  <line x1="300" y1="300" x2="300" y2="360" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="316" y="335" font-size="18" fill="black">is made of</text>

  <rect x="20" y="360" width="560" height="110" fill="white" stroke="black" stroke-width="2"/>
  <text x="40" y="400" font-size="20" fill="black">flow: one run of a model in a harness;</text>
  <text x="40" y="425" font-size="20" fill="black">a permanent flow runs on under its address</text>
</svg>
