<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 470" width="480" height="470" font-family="Arial, Helvetica, sans-serif" font-size="16">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect x="110" y="20" width="260" height="56" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="240" y="54" text-anchor="middle" fill="#000">Psyche: designs the tools</text>
  <line x1="240" y1="76" x2="240" y2="168" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="252" y="128" fill="#000">rules, as vision</text>
  <rect x="110" y="170" width="260" height="56" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="240" y="204" text-anchor="middle" fill="#000">Mind: makes them</text>
  <line x1="240" y1="226" x2="240" y2="318" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="252" y="278" fill="#000">lands, as a running system</text>
  <rect x="110" y="320" width="260" height="56" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="240" y="354" text-anchor="middle" fill="#000">Field: uses them</text>
  <path d="M370,348 L430,348 L430,198 L372,198" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="420" text-anchor="middle" fill="#000">what is not running, as a question</text>
</svg>
