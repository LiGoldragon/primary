<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" font-family="sans-serif" font-size="17" fill="black">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
  </defs>
  <rect x="40" y="20" width="320" height="60" fill="white" stroke="black" stroke-width="2"/>
  <text x="200" y="56" text-anchor="middle">flow's response, as text</text>

  <line x1="200" y1="80" x2="200" y2="158" stroke="black" stroke-width="2" marker-end="url(#head)"/>
  <text x="212" y="125">Report, from the hook</text>

  <rect x="130" y="160" width="140" height="50" fill="white" stroke="black" stroke-width="2"/>
  <text x="200" y="191" text-anchor="middle">translator</text>

  <line x1="150" y1="210" x2="105" y2="288" stroke="black" stroke-width="2" marker-end="url(#head)"/>
  <text x="118" y="236" text-anchor="end">actualizes as</text>
  <text x="118" y="258" text-anchor="end">Input?</text>

  <line x1="250" y1="210" x2="295" y2="288" stroke="black" stroke-width="2" marker-end="url(#head)"/>
  <text x="292" y="246">no</text>

  <rect x="20" y="290" width="170" height="70" fill="white" stroke="black" stroke-width="2"/>
  <text x="105" y="318" text-anchor="middle">yes: the Input,</text>
  <text x="105" y="340" text-anchor="middle">as signal</text>

  <rect x="210" y="290" width="170" height="70" fill="white" stroke="black" stroke-width="2"/>
  <text x="295" y="318" text-anchor="middle">Heard: kept,</text>
  <text x="295" y="340" text-anchor="middle">nothing acted</text>

  <line x1="105" y1="360" x2="105" y2="428" stroke="black" stroke-width="2" marker-end="url(#head)"/>

  <rect x="20" y="430" width="170" height="50" fill="white" stroke="black" stroke-width="2"/>
  <text x="105" y="461" text-anchor="middle">Flow Nexus acts</text>
</svg>
