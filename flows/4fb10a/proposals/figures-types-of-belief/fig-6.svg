<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" width="360" height="420" font-family="sans-serif" font-size="17">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect x="30" y="20" width="300" height="50" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="180" y="51" text-anchor="middle">his vision</text>

  <line x1="180" y1="70" x2="180" y2="120" stroke="#000" stroke-width="2" marker-end="url(#ar)"/>
  <text x="192" y="100" font-size="15">is made into</text>

  <rect x="30" y="120" width="300" height="64" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="180" y="142" text-anchor="middle">a proposal</text>
  <text x="180" y="165" text-anchor="middle" font-size="15">(the proposal module's rules)</text>

  <line x1="180" y1="184" x2="180" y2="234" stroke="#000" stroke-width="2" marker-end="url(#ar)"/>
  <text x="192" y="214" font-size="15">is rendered as</text>

  <rect x="30" y="234" width="300" height="64" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="180" y="256" text-anchor="middle">a book</text>
  <text x="180" y="279" text-anchor="middle" font-size="15">(the book module's rules)</text>

  <line x1="180" y1="298" x2="180" y2="348" stroke="#000" stroke-width="2" marker-end="url(#ar)"/>
  <text x="192" y="328" font-size="15">is shown to</text>

  <rect x="30" y="348" width="300" height="50" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="180" y="379" text-anchor="middle">him</text>
</svg>
