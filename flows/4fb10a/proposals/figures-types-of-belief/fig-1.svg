<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 800" width="420" height="800" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="black">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
  </defs>
  <!-- the living -->
  <rect x="20" y="20" width="140" height="40" fill="white" stroke="black" stroke-width="2"/>
  <text x="90" y="45" text-anchor="middle">the living</text>
  <!-- Psyche -->
  <rect x="10" y="150" width="190" height="64" fill="white" stroke="black" stroke-width="2"/>
  <text x="105" y="176" text-anchor="middle">Psyche: spirit, intent, vision</text>
  <!-- the living reviews Psyche -->
  <line x1="90" y1="60" x2="90" y2="148" stroke="black" stroke-width="2" marker-end="url(#ar)"/>
  <text x="100" y="100">reviews psyche proposals,</text>
  <text x="100" y="118">line by line</text>
  <!-- the living skims Mind -->
  <polyline points="160,40 390,40 390,288" fill="none" stroke="black" stroke-width="2" marker-end="url(#ar)"/>
  <text x="170" y="30">skims knowledge proposals</text>
  <!-- Psyche rules over Mind -->
  <line x1="90" y1="214" x2="90" y2="288" stroke="black" stroke-width="2" marker-end="url(#ar)"/>
  <text x="100" y="240">rules over Mind: a Mind line</text>
  <text x="100" y="258">it contradicts is removed</text>
  <!-- Mind subgraph -->
  <rect x="10" y="290" width="400" height="220" fill="none" stroke="black" stroke-width="2"/>
  <text x="20" y="310" font-weight="bold">Mind</text>
  <rect x="30" y="326" width="360" height="50" fill="white" stroke="black" stroke-width="2"/>
  <text x="210" y="356" text-anchor="middle">knowledge: facts verified in code</text>
  <line x1="90" y1="376" x2="90" y2="436" stroke="black" stroke-width="2" marker-end="url(#ar)"/>
  <text x="100" y="400">an audit for truth and currency</text>
  <text x="100" y="418">finds a variation; it goes to</text>
  <rect x="30" y="436" width="360" height="50" fill="white" stroke="black" stroke-width="2"/>
  <text x="210" y="466" text-anchor="middle">the type that holds what is unclear</text>
  <!-- Mind rules over Field -->
  <line x1="90" y1="510" x2="90" y2="588" stroke="black" stroke-width="2" marker-end="url(#ar)"/>
  <text x="100" y="536">rules over Field: a Field line</text>
  <text x="100" y="554">it contradicts is removed</text>
  <!-- Field -->
  <rect x="10" y="590" width="190" height="50" fill="white" stroke="black" stroke-width="2"/>
  <text x="105" y="620" text-anchor="middle">Field</text>
  <!-- periodic book or audit -->
  <rect x="230" y="590" width="180" height="50" fill="white" stroke="black" stroke-width="2"/>
  <text x="320" y="620" text-anchor="middle">a periodic book or audit</text>
  <polyline points="325,640 325,750 90,750 90,642" fill="none" stroke="black" stroke-width="2" marker-end="url(#ar)"/>
  <text x="100" y="772">reads it as a whole and checks it</text>
  <text x="100" y="790">against Mind and Psyche</text>
</svg>
