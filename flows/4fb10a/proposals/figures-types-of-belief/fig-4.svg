<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="400" height="450" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="360" height="64" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="200" y="58" font-size="24" text-anchor="middle" fill="#000">a module changes</text>

  <line x1="200" y1="84" x2="200" y2="190" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="30" y="122" width="340" height="30" fill="#fff"/>
  <text x="200" y="144" font-size="22" text-anchor="middle" fill="#000">is named as a dependency by</text>

  <rect x="20" y="190" width="360" height="64" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="200" y="228" font-size="24" text-anchor="middle" fill="#000">its dependents</text>

  <line x1="200" y1="254" x2="200" y2="360" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="140" y="292" width="120" height="30" fill="#fff"/>
  <text x="200" y="314" font-size="22" text-anchor="middle" fill="#000">are each</text>

  <rect x="20" y="360" width="360" height="64" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="200" y="398" font-size="24" text-anchor="middle" fill="#000">reviewed against the change</text>
</svg>
