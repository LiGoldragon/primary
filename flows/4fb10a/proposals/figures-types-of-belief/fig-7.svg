<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 690" width="550" height="690" font-family="sans-serif" fill="#000">
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#000"/>
    </marker>
  </defs>
  <g fill="none" stroke="#000" stroke-width="2">
    <!-- a to b: stays -->
    <path d="M130,45 H24 V155 H170" marker-end="url(#arrow)"/>
    <!-- a to c: changes -->
    <path d="M130,45 H24 V295 H170" marker-end="url(#arrow)"/>
    <!-- a to d: is born or is deleted -->
    <path d="M130,45 H24 V445 H170" marker-end="url(#arrow)"/>
    <!-- d to e: proposed as -->
    <path d="M305,490 V600" marker-end="url(#arrow)"/>
    <!-- c to e: proposed as, down the right channel -->
    <path d="M440,295 H462 V635 H440" marker-end="url(#arrow)"/>
  </g>
  <g fill="#fff" stroke="#000" stroke-width="2">
    <rect x="130" y="20" width="200" height="50"/>
    <rect x="170" y="120" width="270" height="70"/>
    <rect x="170" y="240" width="270" height="110"/>
    <rect x="170" y="400" width="270" height="90"/>
    <rect x="170" y="600" width="270" height="70"/>
  </g>
  <g font-size="16" fill="#000">
    <text x="230" y="52" text-anchor="middle" font-size="18">belief module</text>
    <text x="305" y="150" text-anchor="middle">shown whole or</text>
    <text x="305" y="172" text-anchor="middle">beside another</text>
    <text x="305" y="280" text-anchor="middle">line added with a green</text>
    <text x="305" y="302" text-anchor="middle">margin, removed with a red</text>
    <text x="305" y="324" text-anchor="middle">margin, moved with the third</text>
    <text x="305" y="440" text-anchor="middle">shown whole, under a green</text>
    <text x="305" y="462" text-anchor="middle">or a red margin</text>
    <text x="305" y="628" text-anchor="middle">a proposal: land, amend</text>
    <text x="305" y="650" text-anchor="middle">or reject</text>
    <text x="34" y="148">stays</text>
    <text x="34" y="288">changes</text>
    <text x="34" y="418">is born or</text>
    <text x="34" y="436">is deleted</text>
    <text x="315" y="550">proposed as</text>
    <text x="472" y="458">proposed</text>
    <text x="472" y="476">as</text>
  </g>
</svg>
