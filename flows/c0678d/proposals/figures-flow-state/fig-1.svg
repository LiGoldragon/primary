<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 530" width="420" height="530" font-family="sans-serif" font-size="18">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <!-- removed-change margins, light red -->
  <g fill="#ef9a9a">
    <rect x="4" y="30" width="6" height="56"/>
    <rect x="4" y="90" width="6" height="76"/>
    <rect x="4" y="170" width="6" height="56"/>
    <rect x="4" y="230" width="6" height="86"/>
    <rect x="4" y="320" width="6" height="68"/>
    <rect x="4" y="392" width="6" height="44"/>
    <rect x="4" y="440" width="6" height="56"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="2">
    <line x1="210" y1="86" x2="210" y2="170" marker-end="url(#arrow)"/>
    <polyline points="210,226 210,266 110,266 110,320" marker-end="url(#arrow)"/>
    <polyline points="210,226 210,266 310,266 310,320" marker-end="url(#arrow)"/>
    <line x1="110" y1="388" x2="110" y2="440" marker-end="url(#arrow)"/>
    <rect x="60" y="30" width="300" height="56" rx="8"/>
    <rect x="60" y="170" width="300" height="56" rx="8"/>
    <rect x="20" y="320" width="180" height="68" rx="8"/>
    <rect x="220" y="320" width="180" height="68" rx="8"/>
    <rect x="60" y="440" width="300" height="56" rx="8"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="210" y="64">flow's response, as text</text>
    <text x="210" y="204">translator</text>
    <text x="110" y="349">yes: the Input,</text>
    <text x="110" y="371">as signal</text>
    <text x="310" y="349">Heard: kept,</text>
    <text x="310" y="371">nothing acted</text>
    <text x="210" y="474">Flow Nexus acts</text>
  </g>
  <g fill="currentColor">
    <text x="224" y="118">Report, from</text>
    <text x="224" y="140">the hook</text>
    <text x="102" y="250" text-anchor="end">actualizes</text>
    <text x="102" y="272" text-anchor="end">as Input?</text>
    <text x="322" y="290">no</text>
  </g>
</svg>
