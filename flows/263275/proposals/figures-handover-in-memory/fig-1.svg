<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 614" width="540" height="614" font-family="sans-serif">
  <defs>
    <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="12" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 z" fill="#5b6470"/>
    </marker>
  </defs>

  <!-- arrows: one-way relations, each carrying its verb -->
  <line x1="270" y1="80" x2="270" y2="150" stroke="#5b6470" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="270" y1="210" x2="270" y2="260" stroke="#5b6470" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="270" y1="344" x2="270" y2="404" stroke="#5b6470" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="270" y1="464" x2="270" y2="534" stroke="#5b6470" stroke-width="3" marker-end="url(#ah)"/>

  <!-- things and collections -->
  <rect x="60" y="20" width="420" height="60" rx="10" fill="#3b4a5c"/>
  <text x="270" y="57" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Flow Nexus</text>

  <rect x="60" y="150" width="420" height="60" rx="10" fill="#3b4a5c"/>
  <text x="270" y="187" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">the flow</text>

  <rect x="60" y="260" width="420" height="84" rx="10" fill="#3b4a5c"/>
  <text x="270" y="296" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">handover: its judgment on what it</text>
  <text x="270" y="320" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">is still trying to do</text>

  <rect x="60" y="404" width="420" height="60" rx="10" fill="#3b4a5c"/>
  <text x="270" y="441" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Memory: the permaflow's handovers</text>

  <rect x="60" y="534" width="420" height="60" rx="10" fill="#3b4a5c"/>
  <text x="270" y="571" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">the successor, fresh</text>

  <!-- verb labels, on light pills so they read on light and dark surfaces -->
  <rect x="282" y="95" width="150" height="46" rx="6" fill="#eef1f5"/>
  <text x="294" y="113" font-size="17" fill="#1f2933">warns, before</text>
  <text x="294" y="133" font-size="17" fill="#1f2933">the threshold</text>

  <rect x="282" y="222" width="70" height="26" rx="6" fill="#eef1f5"/>
  <text x="294" y="240" font-size="17" fill="#1f2933">sends</text>

  <rect x="282" y="361" width="90" height="26" rx="6" fill="#eef1f5"/>
  <text x="294" y="379" font-size="17" fill="#1f2933">kept in</text>

  <rect x="282" y="476" width="250" height="46" rx="6" fill="#eef1f5"/>
  <text x="294" y="494" font-size="17" fill="#1f2933">composed into the first</text>
  <text x="294" y="514" font-size="17" fill="#1f2933">prompt of</text>
</svg>
