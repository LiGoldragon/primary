<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 640" width="460" height="640" font-family="sans-serif" font-size="22" fill="currentColor" stroke="currentColor">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <g fill="none" stroke-width="2">
    <rect x="120" y="20" width="200" height="64" rx="10"/>
    <rect x="8" y="250" width="214" height="100" rx="10"/>
    <rect x="200" y="490" width="240" height="120" rx="10"/>
  </g>
  <g fill="none" stroke-width="2">
    <line x1="150" y1="84" x2="115" y2="250" marker-end="url(#arrow)"/>
    <line x1="290" y1="84" x2="320" y2="490" marker-end="url(#arrow)"/>
    <line x1="222" y1="300" x2="250" y2="490" marker-end="url(#arrow)"/>
  </g>
  <g stroke="none">
    <text x="220" y="60" text-anchor="middle" font-size="26">Restart</text>
    <text x="115" y="292" text-anchor="middle">harness closed;</text>
    <text x="115" y="322" text-anchor="middle">session kept</text>
    <text x="320" y="527" text-anchor="middle">harness resumed</text>
    <text x="320" y="557" text-anchor="middle">now; queue</text>
    <text x="320" y="587" text-anchor="middle">delivered</text>
    <text x="118" y="170" text-anchor="end">Asleep</text>
    <text x="310" y="200" text-anchor="start">Woken</text>
    <text x="215" y="400" text-anchor="end">a waking message</text>
    <text x="215" y="428" text-anchor="end">arrives</text>
  </g>
</svg>
