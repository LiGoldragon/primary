<svg xmlns="http://www.w3.org/2000/svg" width="470" height="600" viewBox="0 0 470 600">
  <style>
    svg { color: #111; }
    text { font-family: sans-serif; font-size: 18px; fill: currentColor; }
    @media (prefers-color-scheme: dark) { svg { color: #eee; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- the flow -->
  <rect x="75" y="30" width="320" height="76" rx="10" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="235" y="74" text-anchor="middle">a flow: one native session</text>

  <!-- arrow 1: refresh -->
  <line x1="185" y1="106" x2="125" y2="436" stroke="currentColor" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="136" y="240" text-anchor="end">refresh: new</text>
  <text x="136" y="264" text-anchor="end">session,</text>
  <text x="136" y="288" text-anchor="end">handover</text>

  <!-- arrow 2: restart -->
  <line x1="285" y1="106" x2="345" y2="436" stroke="currentColor" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="334" y="240" text-anchor="start">restart:</text>
  <text x="334" y="264" text-anchor="start">same session,</text>
  <text x="334" y="288" text-anchor="start">new process</text>

  <!-- successor -->
  <rect x="30" y="440" width="190" height="76" rx="10" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="125" y="484" text-anchor="middle">a successor, fresh</text>

  <!-- resumed -->
  <rect x="250" y="440" width="190" height="76" rx="10" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="345" y="472" text-anchor="middle">the same flow,</text>
  <text x="345" y="496" text-anchor="middle">resumed</text>
</svg>
