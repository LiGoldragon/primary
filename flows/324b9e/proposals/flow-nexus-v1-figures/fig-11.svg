<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1080" width="720" height="1080" role="img" aria-label="the Flow Nexus and flow relationships">
  <style>
    :root { color-scheme: light dark; }
    .bg { fill: #ffffff; }
    .box { fill: #f4f7fb; stroke: #17212b; stroke-width: 3; }
    .label, .edge-label { fill: #111820; font-family: system-ui, -apple-system, Segoe UI, sans-serif; font-size: 24px; font-weight: 600; }
    .edge-label { font-size: 21px; font-weight: 500; }
    .edge { fill: none; stroke: #17212b; stroke-width: 3; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #111820; }
      .box { fill: #202b36; stroke: #f2f6fa; }
      .label, .edge-label { fill: #f2f6fa; }
      .edge { stroke: #f2f6fa; }
    }
  </style>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="720" height="1080"/>

  <!-- the Flow Nexus -->
  <rect class="box" x="190" y="42" width="340" height="78" rx="14"/>
  <text class="label" x="360" y="90" text-anchor="middle">the Flow Nexus</text>

  <!-- any flow -->
  <rect class="box" x="235" y="250" width="250" height="78" rx="14"/>
  <text class="label" x="360" y="298" text-anchor="middle">any flow</text>

  <!-- roster relation -->
  <path class="edge" d="M 360 120 L 360 245" marker-end="url(#arrow)"/>
  <text class="edge-label" x="390" y="158">roster in the first</text>
  <text class="edge-label" x="390" y="185">prompt, each change</text>
  <text class="edge-label" x="390" y="212">pushed</text>

  <!-- permanent flow, hot -->
  <rect class="box" x="55" y="485" width="285" height="82" rx="14"/>
  <text class="label" x="197" y="536" text-anchor="middle">permanent flow, hot</text>

  <!-- harness subagent -->
  <rect class="box" x="385" y="485" width="280" height="82" rx="14"/>
  <text class="label" x="525" y="536" text-anchor="middle">harness subagent</text>

  <!-- Send -->
  <path class="edge" d="M 300 328 C 275 375, 225 425, 205 480" marker-end="url(#arrow)"/>
  <text class="edge-label" x="215" y="398" text-anchor="middle">Send</text>

  <!-- answers as a message -->
  <path class="edge" d="M 125 485 C 105 395, 155 345, 235 302" marker-end="url(#arrow)"/>
  <text class="edge-label" x="95" y="390" text-anchor="middle">answers as a</text>
  <text class="edge-label" x="95" y="417" text-anchor="middle">message</text>

  <!-- only if no running flow holds the work -->
  <path class="edge" d="M 485 328 C 510 375, 530 425, 530 480" stroke-dasharray="10 9" marker-end="url(#arrow)"/>
  <text class="edge-label" x="545" y="368">only if no running</text>
  <text class="edge-label" x="545" y="395">flow holds the work</text>

  <!-- successor, from its modules -->
  <rect class="box" x="150" y="790" width="420" height="96" rx="14"/>
  <text class="label" x="360" y="830" text-anchor="middle">successor, from its</text>
  <text class="label" x="360" y="861" text-anchor="middle">modules</text>

  <!-- past threshold, replaced by -->
  <path class="edge" d="M 197 567 C 205 655, 250 730, 300 785" marker-end="url(#arrow)"/>
  <text class="edge-label" x="105" y="660">past threshold,</text>
  <text class="edge-label" x="105" y="687">replaced by</text>
</svg>
