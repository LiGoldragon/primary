<svg xmlns="http://www.w3.org/2000/svg" width="600" height="520" viewBox="0 0 600 520" role="img" aria-label="Address: Aspect, Topic, Model flowchart">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/>
    </marker>
    <style>
      .box { fill: #fff; stroke: #111; stroke-width: 2.5; }
      .edge { fill: none; stroke: #111; stroke-width: 2.5; marker-end: url(#arrow); }
      .label { font-family: sans-serif; font-size: 22px; font-weight: 600; fill: #111; stroke: #fff; stroke-width: 5px; paint-order: stroke fill; stroke-linejoin: round; }
      .boxtext { font-family: sans-serif; font-size: 23px; font-weight: 600; fill: #111; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>
  <rect class="box" x="125" y="35" width="350" height="78" rx="10"/>
  <text class="boxtext" x="300" y="74">Address: Aspect, Topic, Model</text>

  <path class="edge" marker-end="url(#arrow)" d="M 250 113 C 220 165, 170 220, 150 320"/>
  <path class="edge" marker-end="url(#arrow)" d="M 350 113 C 380 165, 430 220, 450 320"/>

  <text class="label" x="82" y="190" text-anchor="start">
    <tspan x="82" dy="0">{ Psyche core Fable }</tspan>
  </text>
  <text class="label" x="365" y="190" text-anchor="start">
    <tspan x="365" dy="0">{ Mind core Opus },</tspan>
    <tspan x="365" dy="28">{ Psyche core Astra }</tspan>
  </text>

  <rect class="box" x="35" y="320" width="230" height="82" rx="10"/>
  <text class="boxtext" x="150" y="361">one permaflow</text>
  <rect class="box" x="335" y="320" width="230" height="82" rx="10"/>
  <text class="boxtext" x="450" y="361">
    <tspan x="450" dy="-13">any model in any</tspan>
    <tspan x="450" dy="28">aspect</tspan>
  </text>
</svg>
