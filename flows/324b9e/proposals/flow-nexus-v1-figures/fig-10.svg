<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-label="flowchart">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
  <g fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="70" y="70" width="330" height="130" rx="18" fill="#f8fafc"/>
    <rect x="500" y="70" width="330" height="130" rx="18" fill="#f8fafc"/>
    <rect x="285" y="310" width="330" height="130" rx="18" fill="#f8fafc"/>
    <rect x="70" y="570" width="330" height="130" rx="18" fill="#f8fafc"/>
    <rect x="500" y="570" width="330" height="130" rx="18" fill="#f8fafc"/>
    <rect x="70" y="850" width="330" height="130" rx="18" fill="#f8fafc"/>
    <rect x="500" y="850" width="330" height="130" rx="18" fill="#f8fafc"/>
    <line x1="400" y1="135" x2="500" y2="135" marker-end="url(#arrow)"/>
    <line x1="235" y1="200" x2="375" y2="310" marker-end="url(#arrow)"/>
    <line x1="400" y1="635" x2="500" y2="635" marker-end="url(#arrow)"/>
    <line x1="400" y1="915" x2="500" y2="915" marker-end="url(#arrow)"/>
  </g>
  <g fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="25" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round">
    <text x="235" y="116"><tspan x="235" dy="0">a permanent flow,</tspan><tspan x="235" dy="34">idle</tspan></text>
    <text x="665" y="116"><tspan x="665" dy="0">its harness and</tspan><tspan x="665" dy="34">its pane</tspan></text>
    <text x="450" y="356"><tspan x="450" dy="0">its successor,</tspan><tspan x="450" dy="34">from the handover</tspan></text>
    <text x="235" y="615"><tspan x="235" dy="0">a flow ended,</tspan><tspan x="235" dy="34">transcript kept</tspan></text>
    <text x="665" y="615"><tspan x="665" dy="0">the same flow,</tspan><tspan x="665" dy="34">back</tspan></text>
    <text x="235" y="895"><tspan x="235" dy="0">a successor that</tspan><tspan x="235" dy="34">fails</tspan></text>
    <text x="665" y="895"><tspan x="665" dy="0">predecessor and</tspan><tspan x="665" dy="34">queue</tspan></text>
  </g>
  <g fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="22" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round">
    <text x="450" y="112">keeps</text>
    <text x="295" y="252"><tspan x="295" dy="0">Refresh, or the</tspan><tspan x="295" dy="28">threshold</tspan></text>
    <text x="450" y="612">Resume</text>
    <text x="450" y="892">leaves standing</text>
  </g>
</svg>
