<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 720" width="430" height="720" role="img" aria-label="Nexus flowchart">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/>
    </marker>
    <style>
      .box { fill:#fff; stroke:#111; stroke-width:2; }
      .label { font-family:system-ui,-apple-system,"Segoe UI",sans-serif; font-size:20px; fill:#111; text-anchor:middle; dominant-baseline:middle; paint-order:stroke; stroke:#fff; stroke-width:5px; stroke-linejoin:round; }
      .edge-label { font-family:system-ui,-apple-system,"Segoe UI",sans-serif; font-size:17px; fill:#111; text-anchor:middle; dominant-baseline:middle; paint-order:stroke; stroke:#fff; stroke-width:5px; stroke-linejoin:round; }
      .edge { stroke:#111; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect class="box" x="105" y="35" width="220" height="62" rx="8"/>
  <text class="label" x="215" y="66">Nexus 0.48, running</text>

  <rect class="box" x="105" y="285" width="220" height="62" rx="8"/>
  <text class="label" x="215" y="316">every running flow</text>

  <rect class="box" x="105" y="480" width="220" height="62" rx="8"/>
  <text class="label" x="215" y="511">Nexus 0.49</text>

  <rect class="box" x="190" y="650" width="50" height="28" rx="5"/>

  <path class="edge" marker-end="url(#arrow)" d="M215 97 L215 480"/>
  <text class="edge-label" x="292" y="205">0.49 started beside it</text>

  <path class="edge" marker-end="url(#arrow)" d="M215 347 L215 480"/>
  <text class="edge-label" x="128" y="414">Adopt</text>

  <path class="edge" marker-end="url(#arrow)" d="M130 97 C55 210,55 530,190 650"/>
  <text class="edge-label" x="83" y="557">empty, stopped</text>
</svg>
