<svg xmlns="http://www.w3.org/2000/svg" width="720" height="960" viewBox="0 0 720 960" role="img">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#fff" stroke="#111" stroke-width="1"/>
    </marker>
    <style>
      .node { fill: rgba(127,127,127,.18); stroke: #fff; stroke-width: 3; }
      .edge { fill: none; stroke: #fff; stroke-width: 4; marker-end: url(#arrow); }
      .label { font-family: sans-serif; font-size: 26px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; fill: #fff; stroke: #111; stroke-width: 6px; paint-order: stroke fill; stroke-linejoin: round; }
      .edge-label { font-family: sans-serif; font-size: 22px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; fill: #fff; stroke: #111; stroke-width: 5px; paint-order: stroke fill; stroke-linejoin: round; }
    </style>
  </defs>

  <rect class="node" x="90" y="35" width="540" height="86" rx="18"/>
  <text class="label" x="360" y="78">flow's response, as text</text>

  <rect class="node" x="230" y="235" width="260" height="78" rx="18"/>
  <text class="label" x="360" y="274">translator</text>

  <rect class="node" x="45" y="485" width="300" height="100" rx="18"/>
  <text class="label" x="195" y="535">yes: the Input, as signal</text>

  <rect class="node" x="390" y="485" width="285" height="100" rx="18"/>
  <text class="label" x="532.5" y="535">Heard: kept, nothing acted</text>

  <rect class="node" x="205" y="790" width="310" height="82" rx="18"/>
  <text class="label" x="360" y="831">Flow Nexus acts</text>

  <path class="edge" d="M360 121 L360 235" marker-end="url(#arrow)"/>
  <text class="edge-label" x="470" y="177">Report, from the hook</text>

  <path class="edge" d="M300 313 L195 485" marker-end="url(#arrow)"/>
  <text class="edge-label" x="198" y="390">actualizes as Input?</text>

  <path class="edge" d="M420 313 L532 485" marker-end="url(#arrow)"/>
  <text class="edge-label" x="532" y="390">no</text>

  <path class="edge" d="M195 585 L300 790" marker-end="url(#arrow)"/>
</svg>
