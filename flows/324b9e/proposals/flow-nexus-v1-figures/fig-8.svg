<svg xmlns="http://www.w3.org/2000/svg" width="420" height="500" viewBox="0 0 420 500" role="img" aria-label="flowchart">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#111111"/>
    </marker>
  </defs>
  <rect width="420" height="500" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111111" stroke="#111111" stroke-width="2">
    <rect x="15" y="28" width="190" height="116" rx="12" fill="#f3f6fa"/>
    <text x="110" y="57" text-anchor="middle" font-size="15" stroke="none">
      <tspan x="110" dy="0">default modules:</tspan>
      <tspan x="110" dy="21">the Nexus's one</tspan>
      <tspan x="110" dy="21">configured list</tspan>
    </text>

    <rect x="215" y="28" width="190" height="116" rx="12" fill="#f3f6fa"/>
    <text x="310" y="76" text-anchor="middle" font-size="15" stroke="none">
      <tspan x="310" dy="0">the member's own</tspan>
      <tspan x="310" dy="21">Beliefs</tspan>
    </text>

    <rect x="70" y="382" width="280" height="70" rx="12" fill="#e8eef7"/>
    <text x="210" y="423" text-anchor="middle" font-size="18" stroke="none">the flow's workspace</text>

    <line x1="110" y1="144" x2="165" y2="372" fill="none" marker-end="url(#arrow)"/>
    <line x1="310" y1="144" x2="255" y2="372" fill="none" marker-end="url(#arrow)"/>

    <rect x="63" y="236" width="136" height="30" rx="8" fill="#ffffff" stroke="none"/>
    <text x="131" y="257" text-anchor="middle" font-size="15" stroke="none">composed first</text>

    <rect x="224" y="236" width="145" height="30" rx="8" fill="#ffffff" stroke="none"/>
    <text x="296" y="257" text-anchor="middle" font-size="15" stroke="none">composed after</text>
  </g>
</svg>
