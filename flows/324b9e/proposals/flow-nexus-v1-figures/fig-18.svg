<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1000" viewBox="0 0 720 1000" role="img" aria-label="Flow composes into the first prompt recent raw psyche, belief modules of any kind except spirit and intent starts a fresh flow">
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#26364a"/>
    </marker>
    <style>
      .box { fill:#f4f7fb; stroke:#26364a; stroke-width:3; }
      .edge { fill:none; stroke:#26364a; stroke-width:3; }
      .label { fill:#17202b; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; font-size:28px; font-weight:500; text-anchor:middle; }
      .edge-label { fill:#17202b; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; font-size:25px; font-weight:500; text-anchor:middle; paint-order:stroke; stroke:#ffffff; stroke-width:9px; stroke-linejoin:round; }
    </style>
  </defs>

  <rect class="box" x="50" y="55" width="620" height="120" rx="18"/>
  <text class="label" x="360" y="126">Flow</text>

  <path class="edge" d="M360 175 L360 285" marker-end="url(#arrow)"/>
  <text class="edge-label" x="360" y="231">composes into the first prompt</text>

  <rect class="box" x="50" y="285" width="620" height="235" rx="18"/>
  <text class="label" x="360" y="350">
    <tspan x="360" dy="0">recent raw psyche, belief modules</tspan>
    <tspan x="360" dy="40">of any kind except spirit and intent</tspan>
  </text>

  <path class="edge" d="M360 520 L360 650" marker-end="url(#arrow)"/>
  <text class="edge-label" x="360" y="594">starts</text>

  <rect class="box" x="50" y="650" width="620" height="120" rx="18"/>
  <text class="label" x="360" y="721">a fresh flow</text>
</svg>
