<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1040" viewBox="0 0 720 1040">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
  </defs>
  <rect width="720" height="1040" fill="#fff"/>

  <line x1="360" y1="126" x2="360" y2="214" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="320" y1="292" x2="190" y2="408" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="292" x2="530" y2="408" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="150" y1="492" x2="150" y2="612" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="492" x2="570" y2="612" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 570 612 C 690 500, 690 240, 410 250" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 120 900 C 95 730, 105 390, 310 270" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="360" y="42" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#111">
    <tspan x="360" dy="0">definitions: one datom file per complex,</tspan>
    <tspan x="360" dy="28">metaflow and harness</tspan>
  </text>
  <text x="360" y="238" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="600" fill="#111">Flow Nexus</text>
  <text x="250" y="342" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#111">
    <tspan x="250" dy="0">Define, through</tspan>
    <tspan x="250" dy="23">the CLI</tspan>
  </text>
  <text x="245" y="390" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#111">Furnish, signal</text>
  <text x="470" y="342" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#111">
    <tspan x="470" dy="0">Create, Start, Prompt,</tspan>
    <tspan x="470" dy="23">signal</tspan>
  </text>
  <text x="155" y="452" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="600" fill="#111">Belief Nexus</text>
  <text x="565" y="452" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="600" fill="#111">herdr Nexus</text>
  <text x="150" y="555" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#111">
    <tspan x="150" dy="0">writes the bundle</tspan>
    <tspan x="150" dy="23">and the skills</tspan>
  </text>
  <text x="570" y="555" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#111">runs herdr</text>
  <text x="150" y="660" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="600" fill="#111">workspace</text>
  <text x="570" y="660" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="600" fill="#111">
    <tspan x="570" dy="0">pane: the harness,</tspan>
    <tspan x="570" dy="27">the flow</tspan>
  </text>
  <text x="590" y="365" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#111">
    <tspan x="590" dy="0">Report, through the CLI,</tspan>
    <tspan x="590" dy="22">from a hook</tspan>
  </text>
  <text x="120" y="975" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="600" fill="#111">
    <tspan x="120" dy="0">the living,</tspan>
    <tspan x="120" dy="27">at a CLI</tspan>
  </text>
  <text x="205" y="790" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#111">Say</text>
</svg>
