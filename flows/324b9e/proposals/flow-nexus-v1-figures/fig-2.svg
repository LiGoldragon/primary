<svg xmlns="http://www.w3.org/2000/svg" width="420" height="980" viewBox="0 0 420 980" role="img">
  <style>
    :root { color-scheme: light dark; }
    .node { fill:#ffffff; stroke:#172033; stroke-width:2.5; }
    .edge { fill:none; stroke:#172033; stroke-width:2.5; }
    text { font-family:Arial,Helvetica,sans-serif; font-size:18px; font-weight:600; fill:#172033; text-anchor:middle; dominant-baseline:middle; }
    .edge-label { font-size:15px; font-weight:500; }
    @media (prefers-color-scheme: dark) {
      .node { fill:#182235; stroke:#e5edf8; }
      .edge { stroke:#e5edf8; }
      text { fill:#f7f9fc; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>

  <rect class="node" x="105" y="40" width="210" height="76" rx="14"/>
  <text x="210" y="70">Signal: what it</text>
  <text x="210" y="94">says</text>

  <rect class="node" x="105" y="190" width="210" height="76" rx="14"/>
  <text x="210" y="220">Operation: what it</text>
  <text x="210" y="244">attempts</text>

  <rect class="node" x="105" y="340" width="210" height="76" rx="14"/>
  <text x="210" y="370">Memory: what it</text>
  <text x="210" y="394">remembers</text>

  <rect class="node" x="105" y="570" width="210" height="76" rx="14"/>
  <text x="210" y="600">Emission: what it</text>
  <text x="210" y="624">sends into the world</text>

  <rect class="node" x="105" y="760" width="210" height="76" rx="14"/>
  <text x="210" y="798">world</text>

  <line class="edge" x1="210" y1="116" x2="210" y2="190" marker-end="url(#arrow)"/>
  <line class="edge" x1="210" y1="266" x2="210" y2="340" marker-end="url(#arrow)"/>
  <path class="edge" d="M 105 378 C 35 378, 35 228, 105 228" marker-end="url(#arrow)"/>
  <text class="edge-label" x="48" y="305" transform="rotate(-90 48 305)">succeeded or failed</text>
  <line class="edge" x1="210" y1="416" x2="210" y2="570" marker-end="url(#arrow)"/>
  <line class="edge" x1="210" y1="646" x2="210" y2="760" marker-end="url(#arrow)"/>
  <text class="edge-label" x="315" y="703">its process, the</text>
  <text class="edge-label" x="315" y="724">translator</text>
</svg>
