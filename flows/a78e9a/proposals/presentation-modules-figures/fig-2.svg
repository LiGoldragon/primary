<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 310" width="480" height="310" font-family="sans-serif" font-size="13">
  <style>
    .box { fill: #f1f5f9; stroke: #475569; stroke-width: 1.5; }
    .t { fill: #0f172a; }
    .l { fill: #334155; font-size: 12px; }
    .ar { stroke: #475569; stroke-width: 1.5; fill: none; }
    .mk { fill: #475569; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #1e293b; stroke: #94a3b8; }
      .t { fill: #f1f5f9; }
      .l { fill: #cbd5e1; }
      .ar { stroke: #94a3b8; }
      .mk { fill: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="mk"/>
    </marker>
  </defs>
  <rect class="box" x="140" y="20" width="160" height="40" rx="6"/>
  <text class="t" x="220" y="44" text-anchor="middle">belief module</text>
  <rect class="box" x="10" y="130" width="120" height="50" rx="6"/>
  <text class="t" x="70" y="150" text-anchor="middle">shown whole or</text>
  <text class="t" x="70" y="168" text-anchor="middle">beside another</text>
  <rect class="box" x="150" y="130" width="140" height="50" rx="6"/>
  <text class="t" x="220" y="150" text-anchor="middle">line added in green,</text>
  <text class="t" x="220" y="168" text-anchor="middle">removed in red</text>
  <rect class="box" x="330" y="130" width="140" height="50" rx="6"/>
  <text class="t" x="400" y="150" text-anchor="middle">shown whole,</text>
  <text class="t" x="400" y="168" text-anchor="middle">in green or in red</text>
  <rect class="box" x="220" y="240" width="180" height="50" rx="6"/>
  <text class="t" x="310" y="260" text-anchor="middle">a proposal:</text>
  <text class="t" x="310" y="278" text-anchor="middle">land, amend or reject</text>
  <line class="ar" x1="170" y1="60" x2="70" y2="130" marker-end="url(#ah)"/>
  <text class="l" x="105" y="88" text-anchor="end">stays</text>
  <line class="ar" x1="220" y1="60" x2="220" y2="130" marker-end="url(#ah)"/>
  <text class="l" x="228" y="100">changes</text>
  <line class="ar" x1="270" y1="60" x2="400" y2="130" marker-end="url(#ah)"/>
  <text class="l" x="338" y="84">is born or is deleted</text>
  <line class="ar" x1="220" y1="180" x2="270" y2="240" marker-end="url(#ah)"/>
  <text class="l" x="235" y="216" text-anchor="end">proposed as</text>
  <line class="ar" x1="400" y1="180" x2="350" y2="240" marker-end="url(#ah)"/>
  <text class="l" x="385" y="216">proposed as</text>
</svg>
