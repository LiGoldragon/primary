[package]
name = "unity-poc-mentci-nexus"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "unity-poc-mentci-probe"
path = "src/bin/probe.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
signal.workspace = true
signal-mentci.workspace = true
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "time"] }
tokio-tungstenite = "0.29"
unity-poc-persona-seat = { path = "../persona-seat" }
