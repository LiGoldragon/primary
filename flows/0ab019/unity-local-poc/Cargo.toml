[workspace]
resolver = "3"
members = ["browser-signal-codec", "mentci-nexus", "persona-seat"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
signal = { git = "https://github.com/LiGoldragon/signal", rev = "7bcb0949cdaa4501651ed519625eba48e283fac0", default-features = false }
signal-mentci = { path = "../../../repos/signal-mentci", default-features = false }
serde_json = "1"
time = { version = "0.3", features = ["parsing"] }
