<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#0d1220;color:#edf2ff;font:15px system-ui,sans-serif}.wrap{max-width:640px;margin:auto;padding:20px}.k{color:#9eb0d6;text-transform:uppercase;letter-spacing:.1em;font-size:11px}h1{font-size:22px;margin:6px 0 18px}svg{width:100%;height:auto;display:block}.card{fill:#151d31;stroke:#314462;stroke-width:1.4}.known{fill:#bff3d1}.open{fill:#ffd789}.muted{fill:#aab8d5}.arrow{stroke:#7189b8;stroke-width:2;marker-end:url(#a)}@media(max-width:390px){.wrap{padding:14px}h1{font-size:20px}}</style></head><body><div class="wrap"><div class="k">Open choices, not a rollout</div><h1>Where a Jev decision could become real</h1><svg viewBox="0 0 600 455" role="img" aria-label="Three layers: client, policy, consumer. Each has facts and an owner decision before an authorized implementation."><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3z" fill="#7189b8"/></marker></defs><rect class="card" x="22" y="22" width="556" height="110" rx="14"/><text x="46" y="53" class="known" font-weight="700">1 · CLIENT</text><text x="46" y="78" class="muted">fuzzy-jev 0.6.0: released artifact, direct Decisions endpoint</text><text x="46" y="105" class="open">Open: reuse transport? keep fuzzy rules out?</text><line class="arrow" x1="300" y1="133" x2="300" y2="163"/><rect class="card" x="22" y="165" width="556" height="110" rx="14"/><text x="46" y="196" class="known" font-weight="700">2 · POLICY</text><text x="46" y="221" class="muted">typed answer is data; it does not choose an action</text><text x="46" y="248" class="open">Open: state, threshold, fallback, cost ceiling</text><line class="arrow" x1="300" y1="276" x2="300" y2="306"/><rect class="card" x="22" y="308" width="556" height="110" rx="14"/><text x="46" y="339" class="known" font-weight="700">3 · CONSUMER</text><text x="46" y="364" class="muted">Field monitor/reaping guide and retired-response unselected</text><text x="46" y="391" class="open">Open: guide or decision point? who owns the result?</text><text x="22" y="447" class="muted" font-size="13">Implementation starts only after all three owner decisions.</text></svg></div></body></html>
