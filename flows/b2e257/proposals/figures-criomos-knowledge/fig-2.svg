<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 550" width="360" height="550" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="360" height="550" fill="#ffffff"/>

  <!-- boxes: things -->
  <rect x="30" y="20" width="300" height="48" rx="8" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="180" y="50" font-size="18" text-anchor="middle" fill="#222222">the cluster data</text>

  <rect x="30" y="128" width="300" height="48" rx="8" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="180" y="158" font-size="18" text-anchor="middle" fill="#222222">one node's view</text>

  <rect x="30" y="236" width="300" height="48" rx="8" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="180" y="266" font-size="18" text-anchor="middle" fill="#222222">four flake inputs</text>

  <rect x="30" y="344" width="300" height="48" rx="8" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="180" y="374" font-size="18" text-anchor="middle" fill="#222222">CriomOS</text>

  <rect x="20" y="470" width="160" height="60" rx="8" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="100" y="495" font-size="18" text-anchor="middle" fill="#222222">the host</text>
  <text x="100" y="517" font-size="18" text-anchor="middle" fill="#222222">target</text>

  <rect x="200" y="470" width="144" height="60" rx="8" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="272" y="495" font-size="18" text-anchor="middle" fill="#222222">each user's</text>
  <text x="272" y="517" font-size="18" text-anchor="middle" fill="#222222">Home</text>

  <!-- arrows: one-way relations carrying a verb -->
  <line x1="100" y1="68" x2="100" y2="128" stroke="#333333" stroke-width="2" marker-end="url(#ah)"/>
  <text x="116" y="104" font-size="18" fill="#222222">is projected into</text>

  <line x1="100" y1="176" x2="100" y2="236" stroke="#333333" stroke-width="2" marker-end="url(#ah)"/>
  <text x="116" y="212" font-size="18" fill="#222222">is written by Lojix as</text>

  <line x1="100" y1="284" x2="100" y2="344" stroke="#333333" stroke-width="2" marker-end="url(#ah)"/>
  <text x="116" y="320" font-size="18" fill="#222222">replace the stubs of</text>

  <line x1="80" y1="392" x2="80" y2="470" stroke="#333333" stroke-width="2" marker-end="url(#ah)"/>
  <text x="96" y="436" font-size="18" fill="#222222">builds</text>

  <line x1="300" y1="392" x2="300" y2="470" stroke="#333333" stroke-width="2" marker-end="url(#ah)"/>
  <text x="288" y="418" font-size="18" text-anchor="end" fill="#222222">builds,</text>
  <text x="288" y="440" font-size="18" text-anchor="end" fill="#222222">inside it</text>
</svg>
