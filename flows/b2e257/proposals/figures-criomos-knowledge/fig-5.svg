<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 880" width="500" height="880" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222222"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="500" height="880" fill="#ffffff"/>

  <!-- boxes: things -->
  <rect x="90" y="20" width="320" height="64" rx="8" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="250" y="59" font-size="20" text-anchor="middle" fill="#111111">Deploy, Realize</text>

  <rect x="90" y="174" width="320" height="64" rx="8" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="250" y="213" font-size="20" text-anchor="middle" fill="#111111">DeployAccepted</text>

  <rect x="90" y="328" width="320" height="64" rx="8" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="250" y="367" font-size="20" text-anchor="middle" fill="#111111">a terminal</text>

  <rect x="90" y="482" width="320" height="64" rx="8" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="250" y="521" font-size="20" text-anchor="middle" fill="#111111">Deploy, ActivateNow</text>

  <rect x="90" y="636" width="320" height="64" rx="8" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="250" y="675" font-size="20" text-anchor="middle" fill="#111111">a Current generation</text>

  <rect x="90" y="790" width="320" height="64" rx="8" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="250" y="829" font-size="20" text-anchor="middle" fill="#111111">the live target</text>

  <!-- arrows: one-way relations carrying a verb -->
  <line x1="250" y1="88" x2="250" y2="170" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="266" y="136" font-size="20" fill="#111111">is answered by</text>

  <line x1="250" y1="242" x2="250" y2="324" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="266" y="290" font-size="20" fill="#111111">is queried until</text>

  <line x1="250" y1="396" x2="250" y2="478" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="266" y="444" font-size="20" fill="#111111">Succeeded, permits</text>

  <line x1="250" y1="550" x2="250" y2="632" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="266" y="598" font-size="20" fill="#111111">ends in</text>

  <line x1="250" y1="704" x2="250" y2="786" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="266" y="752" font-size="20" fill="#111111">is checked against</text>
</svg>
