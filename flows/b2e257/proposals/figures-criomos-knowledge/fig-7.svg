<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" width="640" height="800" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="800" fill="#ffffff"/>

  <!-- its meta socket configures Lojix -->
  <rect x="170" y="20" width="300" height="64" rx="8" fill="#f5f5f5" stroke="#444444" stroke-width="2"/>
  <text x="320" y="60" font-size="24" text-anchor="middle" fill="#111111">its meta socket</text>
  <line x1="320" y1="84" x2="320" y2="148" stroke="#333333" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="336" y="122" font-size="22" fill="#111111">configures</text>

  <!-- Lojix as a Nexus v1 -->
  <rect x="40" y="150" width="560" height="80" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="320" y="198" font-size="24" text-anchor="middle" fill="#111111">Lojix as a Nexus v1</text>

  <!-- spine from Lojix to each branch -->
  <line x1="80" y1="230" x2="80" y2="700" stroke="#333333" stroke-width="2.5"/>

  <!-- Lojix pushes each phase to a subscriber -->
  <polyline points="80,340 336,340" fill="none" stroke="#333333" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="92" y="328" font-size="21" fill="#111111">pushes each phase to</text>
  <rect x="340" y="298" width="280" height="84" rx="8" fill="#f5f5f5" stroke="#444444" stroke-width="2"/>
  <text x="480" y="348" font-size="24" text-anchor="middle" fill="#111111">a subscriber</text>

  <!-- Lojix makes each nix call as a typed Emission -->
  <polyline points="80,460 336,460" fill="none" stroke="#333333" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="92" y="448" font-size="21" fill="#111111">makes each nix call</text>
  <rect x="340" y="418" width="280" height="84" rx="8" fill="#f5f5f5" stroke="#444444" stroke-width="2"/>
  <text x="480" y="468" font-size="24" text-anchor="middle" fill="#111111">a typed Emission</text>

  <!-- Lojix runs as a declared unit per version -->
  <polyline points="80,580 336,580" fill="none" stroke="#333333" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="92" y="568" font-size="21" fill="#111111">runs as</text>
  <rect x="340" y="538" width="280" height="84" rx="8" fill="#f5f5f5" stroke="#444444" stroke-width="2"/>
  <text x="480" y="576" font-size="24" text-anchor="middle" fill="#111111">a declared unit</text>
  <text x="480" y="604" font-size="24" text-anchor="middle" fill="#111111">per version</text>

  <!-- Lojix asks a grant of Criome, an edge -->
  <polyline points="80,700 336,700" fill="none" stroke="#333333" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="92" y="688" font-size="21" fill="#111111">asks a grant of</text>
  <rect x="340" y="658" width="280" height="84" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="480" y="708" font-size="24" text-anchor="middle" fill="#111111">Criome, an edge</text>
</svg>
